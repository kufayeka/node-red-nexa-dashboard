<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>state</title>
<style>html,body{margin:0;padding:0}#nexa-runtime-artboard{position:relative;margin:0}</style></head>
<body>
<!-- App state on a deployed page (test/runtime-state-browser.test.js): $route,
     app variables (persisted), operations, On Variable Change, Get Variable and
     the Function node API (vars, storage, cookies, http). -->
<div id="nexa-runtime-artboard" style="width:800px;height:400px;"></div>
<script src="/lib/nexa-registry-client.js"></script>
<script>
// a component that writes (an SDK field / button does the same through ctx.writeTag)
window.__writers = {};
NEXA.registerComponent("writer", { render: function (el, p, ctx) { window.__writers[el.getAttribute ? el.getAttribute("data-id") : "wr"] = ctx; } });
NEXA.registerComponent("label", { render: function (el, p) { el.textContent = typeof p.text === "object" ? JSON.stringify(p.text) : p.text; } });
function label(id, text, y) { return { id: id, type: "label", x: 0, y: y || 0, w: 400, h: 20, props: { text: text } }; }
function v(name, type, value, persist) { var o = { id: "v-" + name, name: name, type: type, defaultValue: value }; if (persist) o.persist = persist; return o; }
window.__NEXA_PARAMS__ = { id: "42" }; window.__NEXA_QUERY__ = { tab: "alarms" };
window.__NEXA_APP__ = { variables: [v("user", "string", "guest", "local"), v("counter", "number", 0, "session"), v("secret", "string", "app-only")] };
window.__NEXA_TEMPLATES__ = [{ id: "T", name: "Badge", width: 200, height: 20, params: [], components: [label("inT", "{user}|{local}")], logic: { nodes: [], wires: [] } }];
var W = function (a, b) { return { id: "w-" + a + "-" + b, from: a, to: b }; };
window.__NEXA_SCREEN__ = { id: "s", width: 800, height: 400, treeVersion: 1, orphans: [],
  variables: [v("local", "string", "screen-only"), v("log", "string", ""), v("items", "array", []), v("cfg", "object", { a: 1 }), v("flag", "boolean", false), v("copy", "number", -1), v("fetched", "number", 0),
    v("file", "string", "data"), v("flag2", "boolean", false), v("cfg2", "object", { limit: 1, unit: "rpm" }), v("apiItems", "array", []), v("err", "string", ""), v("stored", "string", ""), v("cookie", "string", "")],
  components: [
    label("route", "{$route.params.id}/{$route.query.tab}", 0),
    label("user", "{user}", 20), label("counter", "{counter}", 40), label("log", "{log}", 60),
    label("items", "{items}", 80), label("cfg", "{cfg}", 100), label("flag", "{flag}", 120), label("copy", "{copy}", 140), label("fetched", "{fetched}", 160),
    { id: "badge", type: "@template", templateId: "T", x: 0, y: 200, w: 200, h: 20, paramValues: {} },
    { id: "wr", type: "writer", x: 500, y: 0, w: 10, h: 10, props: { toVar: "{flag2}", toPath: "{cfg2.limit}", toQuery: "{$route.query.status}", toMsg: "{msg.payload}" } },
    label("flag2", "{flag2}", 320), label("cfg2", "{cfg2}", 340), label("status", "{$route.query.status}", 360),
    label("apiItems", "{apiItems}", 240), label("err", "{err}", 260), label("stored", "{stored}", 280), label("cookie", "{cookie}", 300)
  ],
  logic: { nodes: [
    { id: "go", type: "inject", once: true, onceDelay: 300, intervalMs: 0, payloadType: "str", payload: "b" },
    { id: "inc", type: "set-variable", scope: "@app", name: "counter", op: "increment", valueSource: "static", value: 5 },
    { id: "watch", type: "on-variable-change", scope: "@app", name: "counter" },
    { id: "fn", type: "function", code: "vars.set('log', msg.previous + '->' + msg.payload); storage.local.set('nexa-test', { n: msg.payload }); cookies.set('sid', 'abc 1', { days: 1 }); var r = await http.get('/fx/data.json'); vars.set('fetched', r.data.value); return msg;" },
    { id: "app1", type: "set-variable", scope: "", name: "items", op: "append", valueSource: "static", value: "a" },
    { id: "app2", type: "set-variable", scope: "", name: "items", op: "append", valueSource: "msg", msgPath: "payload" },
    { id: "mrg", type: "set-variable", scope: "", name: "cfg", op: "merge", valueSource: "static", value: { b: 2 } },
    { id: "tgl", type: "set-variable", scope: "", name: "flag", op: "toggle" },
    { id: "get", type: "get-variable", scope: "@app", name: "counter", target: "payload" },
    { id: "cp", type: "set-variable", scope: "", name: "copy", op: "set", valueSource: "payload" },
    { id: "who", type: "set-variable", scope: "@app", name: "user", op: "set", valueSource: "static", value: "ann" },
    { id: "api", type: "http-request", method: "GET", url: "/fx/{file}.json", timeout: 5000 },
    { id: "keep", type: "set-variable", scope: "", name: "apiItems", op: "set", valueSource: "msg", msgPath: "payload.items" },
    { id: "bad", type: "http-request", method: "GET", url: "/fx/missing-{msg.payload}.json" },
    { id: "keepErr", type: "set-variable", scope: "", name: "err", op: "set", valueSource: "msg", msgPath: "error" },
    { id: "st1", type: "storage", action: "set", store: "session", key: "k-{file}", valueSource: "static", value: "hello" },
    { id: "st2", type: "storage", action: "get", store: "session", key: "k-{file}", target: "payload" },
    { id: "keepSt", type: "set-variable", scope: "", name: "stored", op: "set", valueSource: "payload" },
    { id: "ck1", type: "cookie", action: "set", name: "token", valueSource: "static", value: "t-9", days: 1, path: "/", sameSite: "Lax" },
    { id: "ck2", type: "cookie", action: "get", name: "token", target: "payload" },
    { id: "keepCk", type: "set-variable", scope: "", name: "cookie", op: "set", valueSource: "payload" }
  ], wires: [W("go", "api"), W("api", "keep"), W("go", "bad"), W("bad", "keepErr"), W("go", "st1"), W("st1", "st2"), W("st2", "keepSt"), W("go", "ck1"), W("ck1", "ck2"), W("ck2", "keepCk"),W("go", "inc"), W("watch", "fn"), W("go", "app1"), W("app1", "app2"), W("go", "mrg"), W("go", "tgl"), W("inc", "get"), W("get", "cp"), W("go", "who")] } };
</script>
<script src="/lib/nexa-model-client.js"></script>
<script src="/lib/nexa-runtime-client.js"></script>
</body></html>
