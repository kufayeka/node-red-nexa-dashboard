<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>display</title>
<style>html,body{margin:0;padding:0;background:#ccc}#nexa-runtime-artboard{position:relative;background:#fff;margin:20px auto}</style></head>
<body>
<!-- The screen's display mode (?mode=fixed|fit|fitWidth|fill) and a scrolling
     frame, the way lib/screen-worker.js writes a page (test/runtime-display-browser.test.js). -->
<div id="nexa-runtime-artboard" style="width:400px;height:300px;"></div>
<script src="/dist/nexa-registry-client.js"></script>
<script>
NEXA.registerComponent("box", { render: function (el) { el.style.background = "#0af"; } });
function box(id, w, h, extra) { return Object.assign({ id: id, type: "box", x: 0, y: 0, w: w, h: h, props: {} }, extra || {}); }
var mode = (location.search.match(/mode=(\w+)/) || [])[1];
var sf = (location.search.match(/scale=([\d.]+)/) || [])[1];
var bpMatch = location.search.match(/bpScales=([^&]+)/);
var bpScales = bpMatch ? JSON.parse(decodeURIComponent(bpMatch[1])) : undefined;
window.__NEXA_SCREEN__ = { id: "s", width: 400, height: 300, treeVersion: 1, orphans: [], logic: { nodes: [], wires: [] }, displayMode: mode, scaleFactor: sf ? parseFloat(sf) : undefined, breakpointScales: bpScales,
  components: [
    box("tl", 20, 20, { x: 0, y: 0 }),
    box("br", 20, 20, { x: 380, y: 280, constraints: { h: "right", v: "bottom" } }),
    { id: "list", type: "@frame", name: "List", x: 100, y: 50, w: 150, h: 100, style: { scroll: "vertical" },
      layout: { mode: "vertical", gap: 10 }, children: [box("i1", 150, 60), box("i2", 150, 60), box("i3", 150, 60)] }
  ] };
window.__NEXA_TEMPLATES__ = [];
</script>
<script src="/dist/nexa-model-client.js"></script>
<script src="/dist/nexa-runtime.bundle.js"></script>
</body></html>
