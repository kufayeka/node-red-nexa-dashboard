<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>breakpoints</title>
<style>html,body{margin:0;padding:0}#nexa-runtime-artboard{position:relative;margin:0}</style></head>
<body>
<!-- Breakpoints on a deployed page (test/runtime-breakpoints-browser.test.js). -->
<div id="nexa-runtime-artboard" style="width:1000px;height:600px;"></div>
<script src="/lib/nexa-registry-client.js"></script>
<script>
window.__ctx = {};
NEXA.registerComponent("label", { render: function (el, p) { el.textContent = String(p.text); } });
NEXA.registerComponent("btn", { render: function (el, p, ctx) { window.__ctx[el.getAttribute("data-id")] = ctx; } });
function label(id, x, y, w, h, extra) { return Object.assign({ id: id, type: "label", x: x, y: y, w: w, h: h, props: { text: id } }, extra || {}); }
window.__NEXA_APP__ = { variables: [{ id: "cn", name: "changes", type: "string", defaultValue: "" }] };
window.__NEXA_TEMPLATES__ = [];
window.__NEXA_SCREEN__ = { id: "s", width: 1000, height: 600, treeVersion: 1, orphans: [],
  components: [
    // a row on the desktop, a column from the tablet down
    { id: "row", type: "@frame", x: 0, y: 0, w: 600, h: 300, layout: { mode: "horizontal", gap: 10 },
      overrides: { tablet: { layout: { mode: "vertical" } } },
      children: [label("a", 0, 0, 100, 40), label("b", 0, 0, 100, 40)] },
    // hidden on the phone
    label("side", 700, 0, 200, 300, { overrides: { phone: { visibility: "hide" } } }),
    // another text and a narrower box on the phone
    label("title", 700, 350, 200, 30, { overrides: { phone: { props: { text: "Phone title" }, w: 120 } } }),
    label("bp", 700, 400, 200, 30, { props: { text: "{$breakpoint}" } }),
    label("log", 700, 450, 300, 30, { props: { text: "{changes}" } })
  ],
  logic: { nodes: [
    { id: "onbp", type: "on-variable-change", scope: "@app", name: "$breakpoint" },
    { id: "fn", type: "function", code: "setVariable('changes', getVariable('changes', '@app') + '>' + msg.payload, '@app'); return msg;" }
  ], wires: [{ id: "w1", from: "onbp", to: "fn" }] } };
</script>
<script src="/lib/nexa-model-client.js"></script>
<script src="/lib/nexa-runtime-client.js"></script>
</body></html>
