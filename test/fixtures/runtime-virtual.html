<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>virtual list</title>
<style>html,body{margin:0;padding:0}#nexa-runtime-artboard{position:relative;margin:0}</style></head>
<body>
<!-- A virtual list (Populate "Virtualize") on a deployed page (test/runtime-virtual-browser.test.js). -->
<div id="nexa-runtime-artboard" style="width:1200px;height:800px;"></div>
<script src="/lib/nexa-registry-client.js"></script>
<script>
window.__ctx = {};
NEXA.registerComponent("label", { render: function (el, p) { el.textContent = typeof p.text === "object" ? JSON.stringify(p.text) : String(p.text); } });
NEXA.registerComponent("btn", { render: function (el, p, ctx) { window.__ctx[el.getAttribute("data-id")] = ctx; el.textContent = p.text || "btn"; } });
var W = function (a, b) { return { id: "w-" + a + "-" + b, from: a, to: b }; };
window.__NEXA_APP__ = { variables: [{ id: "lb", name: "lastBought", type: "string", defaultValue: "" }] };
window.__NEXA_TEMPLATES__ = [{ id: "ROW", name: "Row", width: 300, height: 40, params: [{ id: "pp", name: "product", label: "product", type: "object", defaultValue: {} }],
  components: [
    { id: "title", type: "label", x: 0, y: 0, w: 200, h: 20, props: { text: "{index}: {product.name}" } },
    { id: "buy", type: "btn", x: 200, y: 0, w: 60, h: 20, props: { text: "Buy" } }
  ],
  logic: { nodes: [
    { id: "click", type: "ui-event", compId: "buy", event: "click" },
    { id: "keep", type: "set-variable", scope: "@app", name: "lastBought", op: "set", valueSource: "msg", msgPath: "item.name" }
  ], wires: [W("click", "keep")] } }];
function node(id, container, mode, extra) { return Object.assign({ id: id, type: "populate", container: container, template: "ROW", itemParam: "product", key: "id", mode: mode, valueSource: "payload", virtualize: true }, extra || {}); }
window.__NEXA_SCREEN__ = { id: "s", width: 1200, height: 800, treeVersion: 1, orphans: [],
  components: [
    { id: "list", type: "@frame", name: "List", x: 10, y: 10, w: 320, h: 400, layout: { mode: "vertical", gap: 4 }, style: { scroll: "vertical" },
      children: [{ id: "head", type: "label", x: 0, y: 0, w: 300, h: 20, props: { text: "Products" } }] },
    { id: "grid", type: "@frame", name: "Grid", x: 350, y: 10, w: 640, h: 300, layout: { mode: "grid", gap: 10, columns: [{ size: 1, unit: "fr" }, { size: 1, unit: "fr" }] }, children: [] },
    { id: "gridC", type: "@frame", name: "GridC", x: 350, y: 400, w: 640, h: 120, layout: { mode: "grid", gap: 10, alignX: "center", columns: [{ size: 1, unit: "fr" }, { size: 1, unit: "fr" }] }, style: { scroll: "vertical", scrollbar: "hidden" }, children: [] },
    { id: "row", type: "@frame", name: "Row", x: 350, y: 330, w: 640, h: 60, layout: { mode: "horizontal", gap: 10 }, children: [] },
    { id: "ctl", type: "btn", x: 1000, y: 0, w: 10, h: 10, props: {} },
    { id: "last", type: "label", x: 1000, y: 40, w: 200, h: 20, props: { text: "{lastBought}" } }
  ],
  logic: { nodes: [
    { id: "e1", type: "ui-event", compId: "ctl", event: "replace" }, node("p1", "list", "replace"),
    { id: "e2", type: "ui-event", compId: "ctl", event: "upsert" }, node("p2", "list", "upsert"),
    { id: "e3", type: "ui-event", compId: "ctl", event: "remove" }, node("p3", "list", "remove"),
    { id: "e4", type: "ui-event", compId: "ctl", event: "prepend" }, node("p4", "list", "prepend"),
    { id: "e5", type: "ui-event", compId: "ctl", event: "clear" }, node("p5", "list", "clear"),
    { id: "e6", type: "ui-event", compId: "ctl", event: "grid" }, node("p6", "grid", "replace", { fill: true }),
    // through a Layout node, like the editor wires it
    { id: "e8", type: "ui-event", compId: "ctl", event: "gridC" }, node("p8", "gridC", "replace"),
    { id: "e7", type: "ui-event", compId: "ctl", event: "row" }, node("p7", "", "replace"), { id: "lR", type: "layout", container: "row" }
  ], wires: [W("e1", "p1"), W("e2", "p2"), W("e3", "p3"), W("e4", "p4"), W("e5", "p5"), W("e6", "p6"), W("e7", "p7"), W("p7", "lR"), W("e8", "p8")] } };
</script>
<script src="/lib/nexa-model-client.js"></script>
<script src="/lib/nexa-runtime-client.js"></script>
</body></html>
