<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>queries</title>
<style>html,body{margin:0;padding:0}#nexa-runtime-artboard{position:relative;margin:0}</style></head>
<body>
<!-- Query variables on a deployed page (test/runtime-queries-browser.test.js). -->
<div id="nexa-runtime-artboard" style="width:800px;height:400px;"></div>
<script src="/lib/nexa-registry-client.js"></script>
<script>
NEXA.registerComponent("label", { render: function (el, p) { el.textContent = typeof p.text === "object" ? JSON.stringify(p.text) : String(p.text); } });
function label(id, text, y) { return { id: id, type: "label", x: 0, y: y || 0, w: 400, h: 20, props: { text: text } }; }
var W = function (a, b) { return { id: "w-" + a + "-" + b, from: a, to: b }; };
window.__NEXA_APP__ = { variables: [
  { id: "f", name: "file", type: "string", defaultValue: "data" },
  { id: "o", name: "orders", type: "array", defaultValue: null, source: { kind: "http", method: "GET", url: "/fx/{file}.json", path: "items", onLoad: true } }
] };
window.__NEXA_TEMPLATES__ = [];
window.__NEXA_SCREEN__ = { id: "s", width: 800, height: 400, treeVersion: 1, orphans: [],
  variables: [
    { id: "b", name: "broken", type: "object", defaultValue: null, source: { kind: "http", url: "/fx/nope.json", onLoad: true } },
    { id: "s1", name: "seen", type: "number", defaultValue: 0 },
    { id: "u", name: "firstUpdate", type: "number", defaultValue: 0 }
  ],
  components: [
    label("orders", "{orders}", 0), label("loading", "{$status.orders.loading}", 20), label("err", "{$status.broken.error}", 40),
    label("seen", "{seen}", 60), label("updated", "{$status.orders.updatedAt}", 80)
  ],
  logic: { nodes: [
    { id: "watch", type: "on-variable-change", scope: "@app", name: "orders" },
    { id: "count", type: "set-variable", scope: "", name: "seen", op: "increment" },
    { id: "t1", type: "inject", once: true, onceDelay: 800, intervalMs: 0 },
    { id: "swap", type: "set-variable", scope: "@app", name: "file", op: "set", valueSource: "static", value: "data2" },
    { id: "t2", type: "inject", once: true, onceDelay: 1600, intervalMs: 0 },
    { id: "again", type: "refetch-query", scope: "@app", name: "orders" }
  ], wires: [W("watch", "count"), W("t1", "swap"), W("t2", "again")] } };
</script>
<script src="/lib/nexa-model-client.js"></script>
<script src="/lib/nexa-runtime-client.js"></script>
</body></html>
