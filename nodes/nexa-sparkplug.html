<script type="text/javascript">
    RED.nodes.registerType('kufayeka-nexa-sparkplug', {
        category: 'config',
        defaults: {
            name: { value: "Nexa Sparkplug Connection" },
            brokerUrl: { value: "mqtt://localhost:1883", required: true },
            groupFilter: { value: "+" },
            edgeNodeFilter: { value: "+" },
            keepAlive: { value: 30, validate: RED.validators.number() },
            protocolVersion: { value: "4" },
            reconnectPeriod: { value: 5000, validate: RED.validators.number() },
            connectTimeout: { value: 30000, validate: RED.validators.number() },
            clientIdOverride: { value: "" }
        },
        credentials: {
            username: { type: "text" },
            password: { type: "password" },
            rejectUnauthorized: { type: "text" },
            ca: { type: "text" },
            cert: { type: "text" },
            key: { type: "text" }
        },
        label: function () {
            return this.name || "Nexa Sparkplug Connection";
        },
        oneditprepare: function () {
            // rejectUnauthorized is a credentials field (encrypted at rest,
            // like username/password/ca/cert/key above it) but needs a real
            // checkbox in the UI — Node-RED's own generic credential loader
            // only knows how to .val() a field, not .prop("checked", ...) one,
            // so this bridges the stored "true"/"false" string <-> checkbox
            // by hand. Defaults to checked (true) since that's this node's
            // own safe default when the field has never been set.
            var stored = this.credentials && this.credentials.rejectUnauthorized;
            $("#node-config-input-rejectUnauthorized").prop("checked", stored !== "false");
        },
        oneditsave: function () {
            this.credentials.rejectUnauthorized = $("#node-config-input-rejectUnauthorized").prop("checked") ? "true" : "false";
        }
    });
</script>

<script type="text/html" data-template-name="kufayeka-nexa-sparkplug">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="Nexa Sparkplug Connection">
    </div>
    <div class="form-row">
        <label for="node-config-input-brokerUrl"><i class="fa fa-server"></i> Broker URL</label>
        <input type="text" id="node-config-input-brokerUrl" placeholder="mqtt://localhost:1883">
    </div>
    <div class="form-row">
        <label for="node-config-input-username"><i class="fa fa-user"></i> Username</label>
        <input type="text" id="node-config-input-username" placeholder="(optional)">
    </div>
    <div class="form-row">
        <label for="node-config-input-password"><i class="fa fa-lock"></i> Password</label>
        <input type="password" id="node-config-input-password" placeholder="(optional)">
    </div>
    <hr>
    <div class="form-row">
        <label for="node-config-input-groupFilter"><i class="fa fa-object-group"></i> Group ID</label>
        <input type="text" id="node-config-input-groupFilter" placeholder="+ (any group)">
    </div>
    <div class="form-row">
        <label for="node-config-input-edgeNodeFilter"><i class="fa fa-microchip"></i> Edge Node ID</label>
        <input type="text" id="node-config-input-edgeNodeFilter" placeholder="+ (any edge node)">
    </div>
    <hr>
    <div class="form-row">
        <label for="node-config-input-keepAlive"><i class="fa fa-heartbeat"></i> Keep Alive (s)</label>
        <input type="text" id="node-config-input-keepAlive" placeholder="30">
    </div>
    <div class="form-row">
        <label for="node-config-input-protocolVersion"><i class="fa fa-plug"></i> MQTT Version</label>
        <select id="node-config-input-protocolVersion" style="width: calc(100% - 110px);">
            <option value="4">3.1.1 (Sparkplug B default)</option>
            <option value="5">5.0</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-config-input-reconnectPeriod"><i class="fa fa-refresh"></i> Reconnect (ms)</label>
        <input type="text" id="node-config-input-reconnectPeriod" placeholder="5000">
    </div>
    <div class="form-row">
        <label for="node-config-input-connectTimeout"><i class="fa fa-clock-o"></i> Connect Timeout (ms)</label>
        <input type="text" id="node-config-input-connectTimeout" placeholder="30000">
    </div>
    <div class="form-row">
        <label for="node-config-input-clientIdOverride"><i class="fa fa-id-card"></i> Client ID</label>
        <input type="text" id="node-config-input-clientIdOverride" placeholder="(auto: kufayeka-nexa-sparkplug-<node id>)">
    </div>
    <div class="form-row">
        <label for="node-config-input-rejectUnauthorized"><i class="fa fa-lock"></i>&nbsp;</label>
        <input type="checkbox" id="node-config-input-rejectUnauthorized" style="display:inline-block; width:auto; vertical-align:middle;">
        <label for="node-config-input-rejectUnauthorized" style="width:auto;">Reject unauthorized TLS certificates</label>
    </div>
    <div class="form-row">
        <label for="node-config-input-ca"><i class="fa fa-certificate"></i> CA Cert (PEM)</label>
        <textarea id="node-config-input-ca" rows="2" style="width: calc(100% - 110px); font-family: monospace; font-size: 11px;" placeholder="(optional — for mqtts:///wss:// with a private CA)"></textarea>
    </div>
    <div class="form-row">
        <label for="node-config-input-cert"><i class="fa fa-id-badge"></i> Client Cert (PEM)</label>
        <textarea id="node-config-input-cert" rows="2" style="width: calc(100% - 110px); font-family: monospace; font-size: 11px;" placeholder="(optional — mutual TLS)"></textarea>
    </div>
    <div class="form-row">
        <label for="node-config-input-key"><i class="fa fa-key"></i> Client Key (PEM)</label>
        <textarea id="node-config-input-key" rows="2" style="width: calc(100% - 110px); font-family: monospace; font-size: 11px;" placeholder="(optional — mutual TLS)"></textarea>
    </div>
    <div class="form-tips">
        <p>QoS (<code>0</code> for all Sparkplug messages), <code>retain: false</code>, and
        Clean Session (<code>true</code>) are fixed per the Sparkplug B specification and are
        not configurable here — changing them would risk breaking Host Application
        compatibility.</p>
    </div>
    <div class="form-tips">
        <p>Connects to an MQTT broker and listens to
        <code>spBv1.0/&lt;Group ID&gt;/+/&lt;Edge Node ID&gt;[/+]</code>, building the live tree shown
        in the <b>MQTT Sparkplug</b> sidebar tab. Leave Group ID / Edge Node ID as
        <code>+</code> to discover everything on the bus.</p>
        <p>Since NBIRTH/DBIRTH are only published once (and not retained by the
        broker), this node also sends a standard "Node Control/Rebirth" request — to a
        concrete Group/Edge Node ID immediately on connect, or automatically the first
        time it sees data from an Edge Node whose own birth it never saw — so tags that
        never change, or that use metric aliasing, don't stay stuck at "???" forever.
        This is the only thing it ever publishes.</p>
        <p>This node is created and managed automatically by Nexa Dashboard (sidebar →
        MQTT Sparkplug → Configure Connection). It is independent of
        <code>@kufayeka/node-red-asset-engine</code>'s own Sparkplug nodes, if installed —
        Nexa Dashboard works standalone.</p>
    </div>
</script>

<script type="text/html" data-help-name="kufayeka-nexa-sparkplug">
    <p>Nexa Dashboard's own MQTT Sparkplug B connection — used to populate the
    <b>MQTT Sparkplug</b> sidebar tab's live explorer tree, and to feed live values
    into any canvas component bound to a Sparkplug metric. It also sends
    "Node Control/Rebirth" requests (the only thing it ever publishes) so tags that
    never change, or an Edge Node that birthed before this connected, aren't
    invisible forever — use the sidebar tab's "Rebirth / Refresh" button to force one
    manually at any time.</p>
    <p>Created and managed automatically; edit via the sidebar tab's "Configure
    Connection" button rather than dragging this node type directly.</p>
</script>
