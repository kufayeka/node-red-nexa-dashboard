  function applyZoomTransform() {

    var vp = state.viewportEl.get(0);
    if (!focalPoint) {
      focalPoint = { x: vp.clientWidth / 2, y: vp.clientHeight / 2 };
    }
    var sizerOffset = state.sizerEl.position();
    var stageX = (vp.scrollLeft + focalPoint.x - sizerOffset.left) / state.zoomLevel;
    var stageY = (vp.scrollTop + focalPoint.y - sizerOffset.top) / state.zoomLevel;
    state.zoomLevel = newZoom;
    applyZoomTransform();
    var newOffset = state.sizerEl.position();

    var availW = Math.max(vp.clientWidth - pad * 2, 10);
    var availH = Math.max(vp.clientHeight - pad * 2, 10);
    var fitZoom = Math.min(availW / screen.width, availH / screen.height);

    state.zoomLevel = fitZoom;
    applyZoomTransform();
    var sizerW = screen.width * state.zoomLevel, sizerH = screen.height * state.zoomLevel;
    vp.scrollLeft = Math.max(0, (sizerW - vp.clientWidth) / 2);

  function deleteLayer(id) {

    else if (mode === "forward") screen.components.splice(Math.min(idx + 1, screen.components.length), 0, comp);

  // src/logic/logic-wires.js
  var LOGIC_PORT_HIT_RADIUS = 26;

  function logicWirePath(p1, p2) {

    var cp1x = p1.x + scale * LOGIC_NODE_W, cp2x = p2.x - scale * LOGIC_NODE_W;
    return "M " + p1.x + " " + p1.y + " C " + cp1x + " " + p1.y + " " + cp2x + " " + p2.y + " " + p2.x + " " + p2.y;

  function removeLogicWire(id) {

  function groupSelection() {
    if (state.selectedIds.length < 2) {
      RED.notify("Select at least 2 components to group", { type: "warning", timeout: 2e3 });
      return;
    }
    var screen = getActiveScreen();
    if (!screen) return;
    screen.groups = screen.groups || [];
    var members = state.selectedIds.map(findComponent).filter(Boolean);
    if (members.some(function(c) {
      return c.g;
    })) {
      RED.notify("One or more selected components are already in a group \u2014 ungroup first", { type: "warning", timeout: 2500 });
      return;
    }
    var minX = Math.min.apply(null, members.map(function(c) {
      return c.x;
    }));
    var minY = Math.min.apply(null, members.map(function(c) {
      return c.y;
    }));
    var maxX = Math.max.apply(null, members.map(function(c) {
      return c.x + c.w;
    }));
    var maxY = Math.max.apply(null, members.map(function(c) {
      return c.y + c.h;
    }));
    var pad = 10;
    var group = { id: genId(), x: minX - pad, y: minY - pad, w: maxX - minX + pad * 2, h: maxY - minY + pad * 2 };
    var memberIds = members.map(function(c) {
      return c.id;
    });
    screen.groups.push(group);
    memberIds.forEach(function(id) {
      var c = findComponent(id);
      if (c) c.g = group.id;
    });
    pushHistory({ t: "group", screenId: screen.id, group, memberIds });
    markDirty();
    renderActiveScreen();
    selectMultiple(memberIds);
  }
  function ungroupSelection() {
    var screen = getActiveScreen();
    if (!screen) return;
    var groupIds = {};
    state.selectedIds.forEach(function(id) {
      var c = findComponent(id);
      if (c && c.g) groupIds[c.g] = true;
    });
    var ids = Object.keys(groupIds);
    if (!ids.length) return;
    var ungroupEvents = [];
    var allMemberIds = [];
    ids.forEach(function(gid) {
      var group = findGroup(gid);
      if (!group) return;
      var memberIds = groupMemberIds(gid);
      ungroupEvents.push({ t: "ungroup", screenId: screen.id, group, memberIds });
      memberIds.forEach(function(id) {
        var c = findComponent(id);
        if (c) delete c.g;
      });
      screen.groups = (screen.groups || []).filter(function(g) {
        return g.id !== gid;
      });
      allMemberIds = allMemberIds.concat(memberIds);
    });
    if (!ungroupEvents.length) return;
    pushHistory(ungroupEvents.length === 1 ? ungroupEvents[0] : { t: "multi", screenId: screen.id, events: ungroupEvents });
    markDirty();
    renderActiveScreen();

  function startMarqueeSelect(e) {
    if (!state.artboardEl) return;
    var offset = state.artboardEl.offset();
    var startX = (e.pageX - offset.left) / state.zoomLevel;
    var startY = (e.pageY - offset.top) / state.zoomLevel;
    var box = { left: startX, top: startY, width: 0, height: 0 };
    var shiftHeld = e.shiftKey;
    var marqueeEl = $("<div>", { "class": "nexa-marquee" }).css({
      position: "absolute",
      left: startX + "px",
      top: startY + "px",
      width: "0px",
      height: "0px",
      border: "1px dashed #2196f3",
      background: "rgba(33,150,243,0.1)",
      "pointer-events": "none",
      "z-index": 999
    }).appendTo(state.artboardEl);
    function onMove(ev) {
      var curX = (ev.pageX - offset.left) / state.zoomLevel;
      var curY = (ev.pageY - offset.top) / state.zoomLevel;
      box.left = Math.min(startX, curX);
      box.top = Math.min(startY, curY);
      box.width = Math.abs(curX - startX);
      box.height = Math.abs(curY - startY);
      marqueeEl.css({ left: box.left + "px", top: box.top + "px", width: box.width + "px", height: box.height + "px" });

      document.removeEventListener("mousemove", onMove);

      if (box.width < 3 && box.height < 3) return;
      var screen = getActiveScreen();
      if (!screen) return;
      var hits = screen.components.filter(function(c) {
        return !(c.x > box.left + box.width || c.x + c.w < box.left || c.y > box.top + box.height || c.y + c.h < box.top);
      }).map(function(c) {
        return c.id;
      });
      if (shiftHeld) {
        hits.forEach(function(id) {
          if (!isSelected(id)) state.selectedIds.push(id);
        });
        refreshSelectionVisuals();
      } else {

      }
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  }

  // src/canvas/clipboard.js
  var clipboard = null;
  var clipboardSource = null;
  var clipboardFullGroups = null;
  function copySelection(isCut) {
    if (!state.selectedIds.length) return;
    var members = state.selectedIds.map(findComponent).filter(Boolean);
    if (!members.length) return;
    var touchedGroups = {};
    members.forEach(function(c) {
      if (c.g) touchedGroups[c.g] = true;
    });
    var fullGroups = {};
    Object.keys(touchedGroups).forEach(function(gid) {
      var allMembers = groupMemberIds(gid);
      var selectedMembers = allMembers.filter(function(id) {
        return state.selectedIds.indexOf(id) !== -1;
      });
      if (allMembers.length && selectedMembers.length === allMembers.length) fullGroups[gid] = true;
    });
    clipboard = JSON.parse(JSON.stringify(members));
    clipboardFullGroups = fullGroups;
    clipboardSource = isCut ? "cut" : "copy";
    if (isCut) {
      removeComponents(state.selectedIds.slice());
    }
  }
  function pasteClipboard() {
    if (!clipboard || !clipboard.length) return;
    var screen = getActiveScreen();
    if (!screen) return;
    screen.groups = screen.groups || [];
    var regenerateIds = clipboardSource === "copy";
    var groupIdMap = {};
    var newComps = clipboard.map(function(c) {
      var copy = JSON.parse(JSON.stringify(c));
      copy.id = regenerateIds ? genId() : copy.id;
      if (regenerateIds) {
        copy.x += 20;
        copy.y += 20;
      }
      return copy;
    });
    newComps.forEach(function(copy) {
      if (!copy.g) return;
      if (!clipboardFullGroups[copy.g]) {
        delete copy.g;
      } else if (regenerateIds) {
        if (!groupIdMap[copy.g]) groupIdMap[copy.g] = genId();
        copy.g = groupIdMap[copy.g];
      }
    });
    Object.keys(groupIdMap).forEach(function(oldGid) {
      var original = (screen.groups || []).find(function(g) {
        return g.id === oldGid;
      });
      var newGroup = original ? JSON.parse(JSON.stringify(original)) : { x: 0, y: 0, w: 0, h: 0 };
      newGroup.id = groupIdMap[oldGid];
      screen.groups.push(newGroup);
    });
    newComps.forEach(function(copy) {
      screen.components.push(copy);
    });
    newComps.forEach(renderComponent);
    if (newComps.length === 1) {
      pushHistory({ t: "add", screenId: screen.id, comp: newComps[0] });
    } else {
      pushHistory({ t: "multi", screenId: screen.id, events: newComps.map(function(c) {
        return { t: "add", screenId: screen.id, comp: c };
      }) });
    }
    markDirty();
    selectMultiple(newComps.map(function(c) {
      return c.id;
    }));
    if (clipboardSource === "cut") {
      clipboard = newComps;
      clipboardFullGroups = {};
      newComps.forEach(function(c) {
        if (c.g) clipboardFullGroups[c.g] = true;
      });
      clipboardSource = "copy";
    }
  }

  // src/logic/logic-zoom.js
  function applyLogicZoomTransform() {
    if (!state.logicStageEl || !state.logicSizerEl) return;
    state.logicStageEl.css("transform", "scale(" + state.logicZoomLevel + ")");
    state.logicSizerEl.css({
      width: LOGIC_CANVAS_W * state.logicZoomLevel + "px",
      height: LOGIC_CANVAS_H * state.logicZoomLevel + "px"

    if (state.logicZoomLabelEl) state.logicZoomLabelEl.text(Math.round(state.logicZoomLevel * 100) + "%");
  }
  function setLogicZoom(newZoom, focalPoint) {
    if (!state.logicViewportEl || !state.logicSizerEl) return;
    newZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
    if (newZoom === state.logicZoomLevel) return;
    var vp = state.logicViewportEl.get(0);
    if (!focalPoint) focalPoint = { x: vp.clientWidth / 2, y: vp.clientHeight / 2 };
    var sizerOffset = state.logicSizerEl.position();
    var stageX = (vp.scrollLeft + focalPoint.x - sizerOffset.left) / state.logicZoomLevel;
    var stageY = (vp.scrollTop + focalPoint.y - sizerOffset.top) / state.logicZoomLevel;
    state.logicZoomLevel = newZoom;
    applyLogicZoomTransform();
    var newOffset = state.logicSizerEl.position();
    vp.scrollLeft = stageX * state.logicZoomLevel + newOffset.left - focalPoint.x;
    vp.scrollTop = stageY * state.logicZoomLevel + newOffset.top - focalPoint.y;
  }
  function zoomLogicIn() {
    setLogicZoom(state.logicZoomLevel + ZOOM_STEP);
  }
  function zoomLogicOut() {
    setLogicZoom(state.logicZoomLevel - ZOOM_STEP);
  }
  function zoomLogicReset() {
    setLogicZoom(1);
  }
  function zoomLogicToFit() {
    if (!state.logicViewportEl) return;
    var screen = getActiveScreen();
    var nodes = screen && screen.logic && screen.logic.nodes || [];
    var vp = state.logicViewportEl.get(0);
    var pad = 60;
    if (!nodes.length) {
      zoomLogicReset();
      return;
    }
    var minX = Math.min.apply(null, nodes.map(function(n) {
      return n.x;
    }));
    var minY = Math.min.apply(null, nodes.map(function(n) {
      return n.y;
    }));
    var maxX = Math.max.apply(null, nodes.map(function(n) {
      return n.x + LOGIC_NODE_W;
    }));
    var maxY = Math.max.apply(null, nodes.map(function(n) {
      return n.y + LOGIC_NODE_H;
    }));
    var boxW = Math.max(maxX - minX, 10), boxH = Math.max(maxY - minY, 10);
    var availW = Math.max(vp.clientWidth - pad * 2, 10);
    var availH = Math.max(vp.clientHeight - pad * 2, 10);
    var fitZoom = Math.min(availW / boxW, availH / boxH);
    fitZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, fitZoom));
    state.logicZoomLevel = fitZoom;
    applyLogicZoomTransform();
    var centerX = (minX + maxX) / 2, centerY = (minY + maxY) / 2;
    vp.scrollLeft = Math.max(0, centerX * state.logicZoomLevel - vp.clientWidth / 2);
    vp.scrollTop = Math.max(0, centerY * state.logicZoomLevel - vp.clientHeight / 2);
  }
  function buildLogicZoomToolbar(logicPane) {
    var bar = window.$("<div>").css({
      position: "absolute",
      right: "16px",
      bottom: "16px",
      "z-index": "10",
      display: "flex",
      "align-items": "center",
      background: "#fff",
      "border-radius": "4px",
      "box-shadow": "0 1px 4px rgba(0,0,0,0.3)",
      overflow: "hidden"
    }).appendTo(logicPane);
    function zoomBtn(icon, title, onClick) {
      return window.$("<a>", { href: "#", title }).css({
        width: "26px",
        height: "26px",
        display: "flex",
        "align-items": "center",
        "justify-content": "center",
        color: "#555",
        cursor: "pointer"
      }).append(window.$("<i>", { "class": "fa " + icon })).on("click", function(e) {
        e.preventDefault();
        onClick();
      }).appendTo(bar);
    }
    zoomBtn("fa-minus", "Zoom out", zoomLogicOut);
    state.logicZoomLabelEl = window.$("<span>").css({
      width: "44px",
      "text-align": "center",
      "font-size": "11px",
      color: "#555"
    }).appendTo(bar);
    zoomBtn("fa-circle-o", "Reset zoom", zoomLogicReset);
    zoomBtn("fa-plus", "Zoom in", zoomLogicIn);
    zoomBtn("fa-compress", "Zoom to fit (the nodes you have, not the whole canvas)", zoomLogicToFit);
    applyLogicZoomTransform();
  }

  // src/editor-tray.js
  function onKeyDown(e) {
    if (!state.trayContent) return;
    var isTextField = window.$(e.target).is("input,textarea");
    if ((e.key === "Delete" || e.key === "Backspace") && !isTextField) {
      if (state.activeCanvasTab === "logic") {
        if (state.logicSelectedIds.length) {
          e.preventDefault();
          removeLogicNodes(state.logicSelectedIds.slice());
        }
        return;
      }
      if (state.selectedIds.length) {
        e.preventDefault();
        removeComponents(state.selectedIds.slice());
        return;
      }
    }
    if ((e.ctrlKey || e.metaKey) && !isTextField) {
      if (e.key === "z" || e.key === "Z") {
        e.preventDefault();
        if (e.shiftKey) redo();
        else undo();
      } else if (e.key === "y" || e.key === "Y") {
        e.preventDefault();
        redo();
      } else if (e.key === "g" || e.key === "G") {
        if (state.activeCanvasTab === "ui") {
          e.preventDefault();
          if (e.shiftKey) ungroupSelection();
          else groupSelection();
        }
      } else if (e.key === "c" || e.key === "C") {
        e.preventDefault();
        if (state.activeCanvasTab === "logic") copyLogicSelection(false);
        else copySelection(false);
      } else if (e.key === "x" || e.key === "X") {
        e.preventDefault();
        if (state.activeCanvasTab === "logic") copyLogicSelection(true);
        else copySelection(true);
      } else if (e.key === "v" || e.key === "V") {
        e.preventDefault();
        if (state.activeCanvasTab === "logic") pasteLogicClipboard();
        else pasteClipboard();
      }
    }
  }
  function buildCanvasArea(trayBody) {
    trayBody.css({
      height: "100%",
      position: "relative",
      padding: "0",
      overflow: "hidden",
      display: "flex",
      "flex-direction": "column"
    });
    state.zoomLevel = 1;
    var canvasTabsWrap = window.$("<div>").css({ flex: "0 0 auto", background: "#fff", "border-bottom": "1px solid #ddd" }).appendTo(trayBody);
    var canvasTabsUl = window.$("<ul>").appendTo(canvasTabsWrap);
    var panesWrap = window.$("<div>").css({ flex: "1 1 auto", position: "relative", overflow: "hidden" }).appendTo(trayBody);
    var uiPane = window.$("<div>").css({ position: "absolute", top: "0", left: "0", right: "0", bottom: "0" }).appendTo(panesWrap);
    var logicPane = window.$("<div>").css({ position: "absolute", top: "0", left: "0", right: "0", bottom: "0", display: "none" }).appendTo(panesWrap);
    state.viewportEl = window.$("<div>").css({
      height: "100%",
      position: "relative",
      overflow: "auto",
      display: "flex",
      background: "#d8d8d8"
    }).appendTo(uiPane);
    state.sizerEl = window.$("<div>").css({ margin: "auto", "flex-shrink": "0", position: "relative" }).appendTo(state.viewportEl);
    state.stageEl = window.$("<div>").css({
      position: "absolute",
      left: "0",
      top: "0",
      "transform-origin": "0 0"
    }).appendTo(state.sizerEl);
    state.artboardEl = window.$("<div>", { id: "nexa-artboard" }).css({
      position: "relative",
      "box-shadow": "0 0 0 1px rgba(0,0,0,0.15), 0 4px 12px rgba(0,0,0,0.15)"
    }).appendTo(state.stageEl);
    state.artboardEl.on("mousedown", function(e) {
      if (e.target !== state.artboardEl.get(0)) return;
      if (!e.shiftKey) deselectAll();
      startMarqueeSelect(e);
    });
    state.viewportEl.on("wheel", function(e) {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      var oe = e.originalEvent;
      var vpOffset = state.viewportEl.offset();
      var focalPoint = { x: oe.clientX - vpOffset.left, y: oe.clientY - vpOffset.top };
      setZoom(state.zoomLevel + (oe.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP), focalPoint);
    });
    buildZoomToolbar(uiPane);
    state.logicZoomLevel = 1;
    state.logicViewportEl = window.$("<div>").css({
      height: "100%",
      position: "relative",
      overflow: "auto",
      background: "#e9e9e9"
    }).appendTo(logicPane);
    state.logicSizerEl = window.$("<div>").css({ position: "relative" }).appendTo(state.logicViewportEl);
    state.logicStageEl = window.$("<div>").css({
      position: "absolute",
      left: "0",
      top: "0",
      "transform-origin": "0 0"
    }).appendTo(state.logicSizerEl);
    state.logicArtboardEl = window.$("<div>").css({
      position: "relative",
      width: LOGIC_CANVAS_W + "px",
      height: LOGIC_CANVAS_H + "px",
      "background-color": "#fff",
      "background-image": "linear-gradient(to right, #e3e3e3 1px, transparent 1px),linear-gradient(to bottom, #e3e3e3 1px, transparent 1px)",
      "background-size": LOGIC_GRID_SIZE + "px " + LOGIC_GRID_SIZE + "px"
    }).appendTo(state.logicStageEl);
    state.logicArtboardEl.on("mousedown", function(e) {
      if (e.target !== state.logicArtboardEl.get(0)) return;
      if (!e.shiftKey) deselectAllLogic();
      startLogicMarqueeSelect(e);
    });
    state.logicViewportEl.on("wheel", function(e) {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      var oe = e.originalEvent;
      var vpOffset = state.logicViewportEl.offset();
      var focalPoint = { x: oe.clientX - vpOffset.left, y: oe.clientY - vpOffset.top };
      setLogicZoom(state.logicZoomLevel + (oe.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP), focalPoint);
    });
    applyLogicZoomTransform();
    buildLogicZoomToolbar(logicPane);
    var canvasTabs = window.RED.tabs.create({
      element: canvasTabsUl,
      onchange: function(tab) {
        if (!tab) return;
        state.activeCanvasTab = tab.id;
        uiPane.toggle(tab.id === "ui");
        logicPane.toggle(tab.id === "logic");
        if (tab.id === "logic") {
          renderLogicCanvas();
          refreshEventsHighlight();
        } else {
          state.logicSelectedIds = [];
          refreshLogicSelectionVisuals();
        }
      }
    });
    canvasTabs.addTab({ id: "ui", label: "UI" });
    canvasTabs.addTab({ id: "logic", label: "Logic" });
    window.$(document).on("keydown.nexa", onKeyDown);
  }
  function registerPagesEditorAction() {
    window.RED.actions.add("nexa:open-pages-editor", function() {
      window.RED.tray.show({
        id: "nexa-pages-editor",
        title: "Pages",
        width: Infinity,
        buttons: [
          {
            id: "nexa-pages-editor-close",
            text: "Close",
            click: function() {
              window.RED.tray.close();
            }
          }
        ],
        open: function(tray) {
          state.trayContent = tray.find(".red-ui-tray-body");
          buildCanvasArea(state.trayContent);
          ensureScreensLoaded(function() {
            renderActiveScreen();
          });
          if (state.componentsPane) buildPalette(state.componentsPane);
          if (state.eventsPane) renderEventsPanel();
        },
        show: function() {
          window.$("#red-ui-header-shade").hide();
        },
        close: function() {
          window.$(document).off("keydown.nexa");
          state.trayContent = null;
          state.artboardEl = null;
          state.stageEl = null;
          state.sizerEl = null;
          state.viewportEl = null;
          state.zoomLabelEl = null;
          state.logicViewportEl = null;
          state.logicArtboardEl = null;
          state.logicSvgEl = null;
          state.logicStageEl = null;
          state.logicSizerEl = null;
          state.logicZoomLabelEl = null;
          state.logicSelectedIds = [];
          state.activeCanvasTab = "ui";
          state.undoStack = [];
          state.redoStack = [];
        }
      });
    });
  }

  // src/sidebar/screens-panel.js
  function renderScreenList() {
    if (!state.screenListEl) return;
    state.screenListEl.empty();
    state.screens.forEach(function(screen) {
      var row = window.$("<div>", { "class": "nexa-screen-row" }).css({
        padding: "6px 8px",
        cursor: "pointer",
        "border-radius": "3px",
        display: "flex",
        "justify-content": "space-between",
        "align-items": "center",
        background: screen.id === state.activeScreenId ? "#d0e2ff" : "transparent"
      }).appendTo(state.screenListEl);
      window.$("<span>").text(screen.name).appendTo(row);
      if (state.screens.length > 1) {
        window.$("<a>", { href: "#", title: "Delete screen" }).html("&times;").css({ color: "#999" }).on("click", function(e) {
          e.preventDefault();
          e.stopPropagation();
          removeScreen(screen.id);
        }).appendTo(row);
      }
      row.on("click", function() {
        selectScreenFromSidebar(screen.id);
      });
    });
  }
  function renderScreenForm() {
    if (!state.screenFormEl) return;
    var screen = getActiveScreen();
    state.screenFormEl.empty();
    if (!screen) return;
    function row(label, field, value, type) {
      var r = window.$("<div>").css({ "margin-bottom": "8px" }).appendTo(state.screenFormEl);
      window.$("<label>").css({ display: "block", "font-size": "11px", "margin-bottom": "2px", color: "#888" }).text(label).appendTo(r);
      var input = window.$("<input>", { type: type || "text" }).css({ width: "100%", "box-sizing": "border-box" }).val(value).appendTo(r);
      input.on("change", function() {
        var v = type === "number" ? parseInt(input.val(), 10) || 0 : input.val();
        screen[field] = v;
        if (field === "name") renderScreenList();
        markDirty();
        renderActiveScreen();
      });
      return input;
    }
    window.$("<div>").css({ "font-weight": "bold", "font-size": "12px", "margin-bottom": "8px" }).text("Screen Settings").appendTo(state.screenFormEl);
    row("Name", "name", screen.name);
    row("URL path", "path", screen.path);
    row("Width (px)", "width", screen.width, "number");
    row("Height (px)", "height", screen.height, "number");
    row("Grid size (px)", "gridSize", screen.gridSize, "number");
    var snapRow = window.$("<div>").appendTo(state.screenFormEl);
    var snapInput = window.$("<input>", { type: "checkbox" }).prop("checked", screen.snap).css({ "margin-right": "6px" });
    snapInput.on("change", function() {
      screen.snap = snapInput.is(":checked");
      markDirty();
    });
    window.$("<label>").css({ "font-size": "11px", color: "#888" }).append(snapInput).append("Snap to grid").appendTo(snapRow);
  }
  function selectScreenFromSidebar(id) {
    state.activeScreenId = id;
    renderScreenList();
    renderScreenForm();
    renderActiveScreen();
    refreshLogicCanvasIfActive();
  }
  function refreshLogicCanvasIfActive() {
    if (state.activeCanvasTab === "logic") renderLogicCanvas();
  }
  function addScreenFromSidebar() {
    var screen = makeScreen({});
    state.screens.push(screen);
    state.activeScreenId = screen.id;
    renderScreenList();
    renderScreenForm();
    renderActiveScreen();
    refreshLogicCanvasIfActive();
    markDirty();
  }
  function removeScreen(id) {
    if (state.screens.length <= 1) return;
    var wasActive = id === state.activeScreenId;
    state.screens = state.screens.filter(function(s) {
      return s.id !== id;
    });
    if (wasActive) state.activeScreenId = state.screens[0].id;
    renderScreenList();
    renderScreenForm();
    if (wasActive) {
      renderActiveScreen();
      refreshLogicCanvasIfActive();
    }
    markDirty();
  }

  // src/sidebar/sidebar-content.js
  function buildSidebarContent() {
    var container = window.$("<div>").css({ height: "100%", display: "flex", "flex-direction": "column" });
    window.$("<button>", { type: "button" }).text("Open Pages Canvas").css({ margin: "8px", width: "calc(100% - 16px)" }).on("click", function() {
      window.RED.actions.invoke("nexa:open-pages-editor");
    }).appendTo(container);
    var tabsWrap = window.$("<div>").css({ flex: "0 0 auto" }).appendTo(container);
    var ul = window.$("<ul>").appendTo(tabsWrap);
    var panesWrap = window.$("<div>").css({ flex: "1 1 auto", overflow: "auto", position: "relative" }).appendTo(container);
    state.componentsPane = window.$("<div>").css({ padding: "8px" }).appendTo(panesWrap);
    var screensPane = window.$("<div>").css({ padding: "8px", display: "none" }).appendTo(panesWrap);
    state.propertiesPane = window.$("<div>").css({ padding: "8px", display: "none" }).appendTo(panesWrap);
    state.layersPane = window.$("<div>").css({ padding: "8px", display: "none" }).appendTo(panesWrap);
    state.eventsPane = window.$("<div>").css({ padding: "8px", display: "none" }).appendTo(panesWrap);
    state.screenListEl = window.$("<div>", { "class": "nexa-screen-list" }).css({ "margin-bottom": "8px" }).appendTo(screensPane);
    window.$("<button>", { type: "button" }).text("+ Add Screen").css({ width: "100%" }).on("click", addScreenFromSidebar).appendTo(screensPane);
    state.screenFormEl = window.$("<div>").css({ "margin-top": "14px", "border-top": "1px solid #ddd", "padding-top": "10px" }).appendTo(screensPane);
    var sidebarTabs = window.RED.tabs.create({
      element: ul,
      onchange: function(tab) {
        if (!tab) return;
        state.componentsPane.toggle(tab.id === "components");
        screensPane.toggle(tab.id === "screens");
        state.propertiesPane.toggle(tab.id === "properties");
        state.layersPane.toggle(tab.id === "layers");
        state.eventsPane.toggle(tab.id === "events");
        if (tab.id === "screens") {
          ensureScreensLoaded(function() {
            renderScreenList();
            renderScreenForm();
          });
        }
        if (tab.id === "components") buildPalette(state.componentsPane);
        if (tab.id === "properties") renderPropertiesPanel();
        if (tab.id === "layers") renderLayersPanel();
        if (tab.id === "events") renderEventsPanel();
      }
    });
    sidebarTabs.addTab({ id: "components", label: "Components" });
    sidebarTabs.addTab({ id: "screens", label: "Screens" });
    sidebarTabs.addTab({ id: "properties", label: "Properties" });
    sidebarTabs.addTab({ id: "layers", label: "Layers" });
    sidebarTabs.addTab({ id: "events", label: "Events" });
    return container;
  }

  // src/index.js
  registerPagesEditorAction();
  if (typeof window.RED !== "undefined" && window.RED.plugins) {
    window.RED.plugins.registerPlugin("kufayeka-nexa-dashboard", {
      type: "node-red-editor-plugin",
      onadd: function() {
        window.RED.menu.addItem("red-ui-header-button-sidemenu", {
          id: "menu-item-nexa-open-pages",
          label: "Pages (Nexa Dashboard)",
          onselect: "nexa:open-pages-editor"
        });
        window.RED.sidebar.addTab({
          id: "nexa-dashboard-sidebar",
          label: "Nexa",
          name: "Nexa Dashboard",
          iconClass: "fa fa-object-group",
          content: buildSidebarContent(),
          enableOnEdit: true
        });
      }
    });
  }
})();

</script>
