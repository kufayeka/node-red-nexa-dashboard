<script type="text/javascript">
// --- NEXA component registry -------------------------------------------
// Component plugins call NEXA.registerComponent(id, def) from their own
// .html — see @kufayeka/nexa-component-basic-shapes for real examples (one
// plain-DOM component, one Lit-based Web Component; the contract doesn't
// care which). This runs unconditionally (not inside the `typeof RED`
// guard below) and BEFORE any check for whether it's "the real one" yet,
// because plugin/node .html files load via bundles with no guaranteed
// order between packages (the same class of bug already hit twice in this
// codebase: RED.asset being a per-plugin object, and RED.nodes.getType
// timing) — so a component plugin's own required first line
// (window.NEXA = window.NEXA || {_q:[], registerComponent:...}) may have
// already queued registrations before this file got a chance to run.
(function () {
    var pendingQueue = (window.NEXA && window.NEXA._q) || [];
    var registry = {};
    window.NEXA = {
        registerComponent: function (id, def) {
            registry[id] = def;
        },
        getComponent: function (id) {
            return registry[id];
        },
        getComponents: function () {
            return Object.keys(registry).map(function (id) {
                var def = registry[id];
                return {
                    id: id,
                    category: def.category || "General",
                    label: def.label || id,
                    icon: def.icon,
                    defaultSize: def.defaultSize || { w: 100, h: 60 },
                    capabilities: def.capabilities || {},
                    defaults: def.defaults || {},
                    bindable: def.bindable || [],
                    render: def.render,
                    onBind: def.onBind,
                    // Every event a component fires is DEFINED BY THE
                    // PLUGIN, not synthesized by the dashboard — a bare
                    // string ("click") still works (normalized to a
                    // generic "On click" label here, for components that
                    // don't need anything fancier), but a plugin author
                    // can supply { name, label } so the Events palette
                    // shows a real, specific label instead of a generic
                    // "on <raw-event-name>" the dashboard made up.
                    events: (def.events || []).map(function (e) {
                        return typeof e === "string" ? { name: e, label: "On " + e } : { name: e.name, label: e.label || ("On " + e.name) };
                    })
                };
            });
        }
    };
    pendingQueue.forEach(function (item) { window.NEXA.registerComponent(item[0], item[1]); });
})();

(function () {
    if (typeof RED === "undefined") return;

    var componentsPane = null; // hoisted so both the sidebar tab and the
    // tray's open() can refresh it — component plugins can register after
    // this sidebar content was first built (same load-order note above).
    var propertiesPane = null; // hoisted so refreshSelectionVisuals()/deselectAll()
    // can refresh it from wherever selection changes on the canvas.
    var layersPane = null; // hoisted so layer/z-order actions (which can be
    // triggered from this tab itself) can refresh it after they run.
    var eventsPane = null; // hoisted so it can be refreshed after adding/
    // removing a component (its event/update node list is derived from
    // the active screen's current components) and on tray open, same
    // load-order reasoning as componentsPane above.

    // --- Screen data model. Persisted the same way node-red-asset-engine
    // persists its schema: as a property on a config node (kufayeka-nexa-
    // project, see ../nodes/nexa-project.js), NOT a separate JSON file. That
    // means it's included in flows.json / export / import / Projects(git)
    // and saved by Node-RED's own Deploy — no save endpoint of our own.
    var screens = [];
    var activeScreenId = null;
    var screensLoaded = false;
    var screenCounter = 0;
    var projectConfigNode = null;

    var trayContent = null;
    var artboardEl = null;
    var stageEl = null;
    var sizerEl = null; // reserves scroll space for the SCALED stage size (a transform alone doesn't affect layout/scroll size)
    var viewportEl = null; // the scrollable ancestor — needed to read/set scroll position for focal-point zoom
    var zoomLabelEl = null; // the "100%" readout in the floating zoom toolbar
    var selectedIds = []; // multi-select: plain array, small N, order = click order

    // Logic canvas (the "Logic" sub-tab next to "UI" inside buildCanvasArea)
    // — a separate, much simpler node-box canvas, no zoom/selection-handles/
    // grouping. Hoisted for the same reason as artboardEl/stageEl above:
    // built once per tray-open, read/written from functions triggered by
    // the sidebar's Events tab and by node/wire interactions on the canvas.
    var logicViewportEl = null;
    var logicArtboardEl = null;
    var logicSvgEl = null;
    // Multi-select on the Logic canvas — its own array, deliberately never
    // mixed with selectedIds (the UI canvas's own selection). Mirrors the
    // UI canvas's own selectedIds pattern (plain array, click/shift-click/
    // marquee, small N so no Set needed) rather than the single-id it
    // started as, so click/shift-click/marquee/Delete work the same way
    // here as they already do for UI components.
    var logicSelectedIds = [];
    // Which canvas sub-tab is currently showing — onKeyDown's Delete/
    // Backspace handling reads this so it acts on the right selection.
    // Without this, a UI component selected before switching to the Logic
    // tab (selectedIds isn't touched by the tab switch itself) would get
    // deleted instead of the logic node the user actually meant to remove.
    var activeCanvasTab = "ui";
    var SVG_NS = "http://www.w3.org/2000/svg";
    var LOGIC_CANVAS_W = 2000, LOGIC_CANVAS_H = 1400;
    var LOGIC_NODE_W = 150, LOGIC_NODE_H = 34;
    var LOGIC_GRID_SIZE = 20;
    // Same zoom mechanics as the UI canvas (ZOOM_MIN/MAX/STEP below,
    // applyZoomTransform/setZoom/zoomToFit), deliberately mirrored as its
    // own parallel set of vars/functions rather than shared — the UI
    // canvas's zoom code is proven (including the jQuery-UI-drag-under-
    // CSS-scale fix) and this avoids risking a regression there while
    // giving the Logic canvas the same capability.
    var logicZoomLevel = 1;
    var logicStageEl = null;
    var logicSizerEl = null;
    var logicZoomLabelEl = null;
    // hasInput/hasOutput determine which port dots a node gets; onload/
    // onrender/onclose/ui-event are pure SOURCES (no input — they're only
    // ever started by fireLifecycle/fireUiEvent, never by an incoming
    // wire); ui-update/debug are pure SINKS.
    var LOGIC_NODE_KINDS = {
        onload: { label: "On Load", hasInput: false, hasOutput: true, color: "#4b7d4b" },
        onrender: { label: "On Render", hasInput: false, hasOutput: true, color: "#4b7d4b" },
        onclose: { label: "On Close", hasInput: false, hasOutput: true, color: "#4b7d4b" },
        "ui-event": { hasInput: false, hasOutput: true, color: "#3a6fb0" },
        "ui-update": { hasInput: true, hasOutput: false, color: "#b0663a" },
        "function": { label: "Function", hasInput: true, hasOutput: true, color: "#7a5aa8" },
        "debug": { label: "Debug", hasInput: true, hasOutput: false, color: "#777" },
        // A SOURCE, like the lifecycle nodes — fires on its own on an
        // interval once the deployed page has mounted (config: intervalMs).
        "inject": { label: "Inject", hasInput: false, hasOutput: true, color: "#a5c261" },
        // Sinks — terminal actions with no output to wire further.
        "reload": { label: "Reload Page", hasInput: true, hasOutput: false, color: "#8a8a8a" },
        "open-url": { label: "Open URL", hasInput: true, hasOutput: false, color: "#5a8f8f" }
    };

    // --- Zoom. Mirrors Node-RED's own flow-editor zoom toolbar/constants
    // (view.js / view-zoom-constants.js: MIN_ZOOM/MAX_ZOOM/ZOOM_STEP), but
    // adapted for OUR case — one small FIXED-size artboard per screen,
    // not an effectively-infinite canvas that must always fill the
    // viewport. So there's no calculateMinZoom() forcing a viewport-filling
    // minimum; ZOOM_MIN is just a fixed floor that still lets a big SCADA
    // screen be zoomed way out to see the whole thing.
    var ZOOM_MIN = 0.1;
    var ZOOM_MAX = 2.0;
    var ZOOM_STEP = 0.2;
    var zoomLevel = 1;

    // Sidebar elements, built once when the editor loads and kept alive
    // for the whole session — independent of the tray's own open/close
    // lifecycle, so the palette and screen list are always usable.
    var screenListEl = null;
    var screenFormEl = null;

    function genId() {
        return "n" + Math.random().toString(16).slice(2, 10);
    }

    function snap(v, gridSize) {
        return Math.round(v / gridSize) * gridSize;
    }

    function getActiveScreen() {
        return screens.find(function (s) { return s.id === activeScreenId; });
    }

    function makeScreen(opts) {
        screenCounter++;
        return {
            id: genId(),
            name: (opts && opts.name) || ("Screen " + screenCounter),
            path: (opts && opts.path) || ("/screen" + screenCounter),
            width: (opts && opts.width) || 1280,
            height: (opts && opts.height) || 800,
            gridSize: (opts && opts.gridSize) || 20,
            snap: opts ? opts.snap !== false : true,
            components: (opts && opts.components) || [],
            // Groups mirror @node-red/editor-client's group.js: a group
            // record only holds a DERIVED bbox — membership lives on the
            // member (component.g = groupId), not as a list on the group.
            groups: (opts && opts.groups) || [],
            // Layers: a hierarchical tree (parentId pointers, like group
            // membership above) purely for organization/visibility — NOT
            // for z-order, which stays the flat `components` array order
            // (already the render order, needs no separate concept). Every
            // component always belongs to exactly one layer.
            layers: (opts && opts.layers) || [{ id: "default", name: "Default Layer", parentId: null, visible: true }],
            // Per-screen logic graph: lifecycle/UI-event nodes wired to
            // UI-update/function/debug nodes, executed by a small
            // synchronous graph walker (see runLogicGraph) — a simple event
            // loop scoped to this screen, NOT the real Node-RED flow
            // runtime. See the "Logic" sub-tab in buildCanvasArea and the
            // "Events" sidebar tab (renderEventsPanel).
            logic: (opts && opts.logic) || { nodes: [], wires: [] }
        };
    }

    function markDirty() {
        // Keep the config node's own property in sync with our in-memory
        // `screens` — some operations (e.g. removing a screen) reassign the
        // top-level `screens` variable to a new array, which would silently
        // detach it from the node otherwise. Same mechanism a moved/edited
        // flow node uses to light up the main Deploy button — Nexa Dashboard
        // deliberately has no deploy button of its own.
        if (projectConfigNode) projectConfigNode.screens = screens;
        RED.nodes.dirty(true);
    }

    // --- Persistence: find-or-create the kufayeka-nexa-project config node
    // (mirrors how @node-red/editor-client's editor.js:1353-1367 builds a
    // brand new config node object before RED.nodes.add) ------------------

    function getOrCreateProjectConfigNode() {
        var existing = null;
        RED.nodes.eachConfig(function (n) {
            if (n.type === "kufayeka-nexa-project") existing = n;
        });
        if (existing) return existing;

        var node_def = RED.nodes.getType("kufayeka-nexa-project");
        if (!node_def) {
            RED.notify("Nexa Dashboard: kufayeka-nexa-project node type not found — is the package installed correctly?", { type: "error" });
            return null;
        }
        var node = {
            id: RED.nodes.id(),
            _def: node_def,
            type: "kufayeka-nexa-project",
            z: "", // global scope config node, not tied to any flow tab
            users: [],
            name: "Nexa Project",
            screens: []
        };
        for (var d in node_def.defaults) {
            if (node[d] === undefined && node_def.defaults[d].value !== undefined) {
                node[d] = JSON.parse(JSON.stringify(node_def.defaults[d].value));
            }
        }
        RED.nodes.add(node);
        RED.nodes.dirty(true);
        return node;
    }

    function ensureScreensLoaded(cb) {
        if (screensLoaded) {
            if (cb) cb();
            return;
        }
        projectConfigNode = getOrCreateProjectConfigNode();
        var data = (projectConfigNode && projectConfigNode.screens) || [];
        // Screens persisted before the groups/layers features existed
        // won't have these fields — default them rather than litter every
        // group/layer function with the same fallback.
        data.forEach(function (s) {
            if (!s.groups) s.groups = [];
            if (!s.layers || !s.layers.length) s.layers = [{ id: "default", name: "Default Layer", parentId: null, visible: true }];
            s.components.forEach(function (c) { if (!c.layerId) c.layerId = s.layers[0].id; });
            if (!s.logic) s.logic = { nodes: [], wires: [] };
        });
        screenCounter = data.length;
        screens = data.length ? data : [makeScreen({ name: "Screen 1", path: "/screen1" })];
        if (projectConfigNode) projectConfigNode.screens = screens;
        activeScreenId = screens[0].id;
        screensLoaded = true;
        renderScreenList();
        renderScreenForm();
        if (cb) cb();
    }

    // --- Undo/redo. Same push/pop/event-shape *pattern* as RED.history
    // (history.js:40 undoEvent, keyed by ev.t), but a genuinely separate
    // stack — history.js's dispatcher is a hardcoded if/else chain over
    // known flow event types (move/delete/createGroup/...) with no fallback
    // for an unrecognized `t`, so pushing our own event types onto the real
    // RED.history would silently no-op on undo. Safe to keep fully separate
    // without UX conflict: RED's own ctrl-z/ctrl-y are scoped to
    // #red-ui-workspace / #red-ui-sidebar-node-config in keymap.json, not
    // global, and our tray lives outside both — see the keydown.nexa
    // listener below, active only while this tray is open.
    var undoStack = [];
    var redoStack = [];

    function pushHistory(ev) {
        undoStack.push(ev);
        redoStack = [];
    }

    // Pure state mutation, no render/dirty side effects — "multi" (a batched
    // group-move or group-delete) recurses into this, not into
    // applyHistoryEvent, so the render/markDirty side effects below happen
    // exactly once per undo/redo regardless of how many sub-events it has.
    // Mirrors @node-red/editor-client's own history.js "multi" pattern
    // (reverse-iterated on undo, forward on redo).
    function applyHistoryMutation(ev, direction) {
        var screen = screens.find(function (s) { return s.id === ev.screenId; });
        if (!screen) return;
        if (ev.t === "multi") {
            var subs = direction === "undo" ? ev.events.slice().reverse() : ev.events;
            subs.forEach(function (sub) { applyHistoryMutation(sub, direction); });
        } else if (ev.t === "add") {
            if (direction === "undo") {
                screen.components = screen.components.filter(function (c) { return c.id !== ev.comp.id; });
            } else {
                screen.components.push(ev.comp);
            }
        } else if (ev.t === "delete") {
            if (direction === "undo") {
                screen.components.push(ev.comp);
            } else {
                screen.components = screen.components.filter(function (c) { return c.id !== ev.comp.id; });
            }
        } else if (ev.t === "move") {
            var comp = screen.components.find(function (c) { return c.id === ev.id; });
            if (!comp) return;
            var pos = direction === "undo" ? ev.from : ev.to;
            comp.x = pos.x;
            comp.y = pos.y;
        } else if (ev.t === "resize") {
            var rcomp = screen.components.find(function (c) { return c.id === ev.id; });
            if (!rcomp) return;
            var box = direction === "undo" ? ev.from : ev.to;
            rcomp.x = box.x; rcomp.y = box.y; rcomp.w = box.w; rcomp.h = box.h;
        } else if (ev.t === "rotate") {
            var tcomp = screen.components.find(function (c) { return c.id === ev.id; });
            if (!tcomp) return;
            tcomp.rotation = direction === "undo" ? ev.from : ev.to;
        } else if (ev.t === "group") {
            screen.groups = screen.groups || [];
            if (direction === "undo") {
                ev.memberIds.forEach(function (id) { var c = screen.components.find(function (x) { return x.id === id; }); if (c) delete c.g; });
                screen.groups = screen.groups.filter(function (g) { return g.id !== ev.group.id; });
            } else {
                if (!screen.groups.some(function (g) { return g.id === ev.group.id; })) screen.groups.push(ev.group);
                ev.memberIds.forEach(function (id) { var c = screen.components.find(function (x) { return x.id === id; }); if (c) c.g = ev.group.id; });
            }
        } else if (ev.t === "ungroup") {
            // Exact inverse of "group" — undo re-creates it, redo removes it again.
            screen.groups = screen.groups || [];
            if (direction === "undo") {
                if (!screen.groups.some(function (g) { return g.id === ev.group.id; })) screen.groups.push(ev.group);
                ev.memberIds.forEach(function (id) { var c = screen.components.find(function (x) { return x.id === id; }); if (c) c.g = ev.group.id; });
            } else {
                ev.memberIds.forEach(function (id) { var c = screen.components.find(function (x) { return x.id === id; }); if (c) delete c.g; });
                screen.groups = screen.groups.filter(function (g) { return g.id !== ev.group.id; });
            }
        } else if (ev.t === "addLogicNode") {
            if (direction === "undo") {
                screen.logic.nodes = screen.logic.nodes.filter(function (n) { return n.id !== ev.node.id; });
            } else {
                screen.logic.nodes.push(ev.node);
            }
        } else if (ev.t === "deleteLogicNode") {
            // Mirrors "delete" above, plus the wires that were touching it
            // (removeLogicNode always deletes both together — see there).
            if (direction === "undo") {
                screen.logic.nodes.push(ev.node);
                ev.wires.forEach(function (w) { screen.logic.wires.push(w); });
            } else {
                screen.logic.nodes = screen.logic.nodes.filter(function (n) { return n.id !== ev.node.id; });
                var removedWireIds = ev.wires.map(function (w) { return w.id; });
                screen.logic.wires = screen.logic.wires.filter(function (w) { return removedWireIds.indexOf(w.id) === -1; });
            }
        } else if (ev.t === "moveLogicNode") {
            var lnode = screen.logic.nodes.find(function (n) { return n.id === ev.id; });
            if (!lnode) return;
            var lpos = direction === "undo" ? ev.from : ev.to;
            lnode.x = lpos.x; lnode.y = lpos.y;
        } else if (ev.t === "addLogicWire") {
            if (direction === "undo") {
                screen.logic.wires = screen.logic.wires.filter(function (w) { return w.id !== ev.wire.id; });
            } else {
                screen.logic.wires.push(ev.wire);
            }
        } else if (ev.t === "deleteLogicWire") {
            if (direction === "undo") {
                screen.logic.wires.push(ev.wire);
            } else {
                screen.logic.wires = screen.logic.wires.filter(function (w) { return w.id !== ev.wire.id; });
            }
        }
    }

    // Any event type whose name ends in "LogicNode"/"LogicWire" belongs to
    // the Logic canvas, not the UI artboard — a "multi" batch inherits
    // whichever kind its first sub-event is (batches are never mixed, see
    // every call site that constructs one).
    function isLogicHistoryEvent(ev) {
        if (ev.t === "multi") return ev.events.length > 0 && isLogicHistoryEvent(ev.events[0]);
        return ev.t.indexOf("Logic") !== -1;
    }

    function applyHistoryEvent(ev, direction) {
        applyHistoryMutation(ev, direction);
        var screen = screens.find(function (s) { return s.id === ev.screenId; });
        if (isLogicHistoryEvent(ev)) {
            logicSelectedIds = [];
            if (screen && screen.id === activeScreenId) renderLogicCanvas();
        } else {
            selectedIds = [];
            if (screen && screen.id === activeScreenId) renderActiveScreen();
        }
        markDirty();
    }

    function undo() {
        if (!undoStack.length) return;
        var ev = undoStack.pop();
        applyHistoryEvent(ev, "undo");
        redoStack.push(ev);
    }

    function redo() {
        if (!redoStack.length) return;
        var ev = redoStack.pop();
        applyHistoryEvent(ev, "redo");
        undoStack.push(ev);
    }

    // --- Component rendering (operates on the active screen's artboard) --

    // Resize/rotate/lock are CANVAS concerns, not per-component-type ones —
    // every component gets the same handles/behavior, gated only by the
    // capability flags its type declared (capabilities.resizable/rotatable/
    // lockable). A component's render() never has to know any of this
    // exists; it only ever sees the wrapper's *content* area.
    var HANDLE_SIZE = 8;
    var selectionHandlesEl = null;

    function findComponent(id) {
        var screen = getActiveScreen();
        return screen && screen.components.find(function (c) { return c.id === id; });
    }

    // --- Groups (mirrors @node-red/editor-client's group.js — see
    // makeScreen() above for why membership lives on the component, not
    // the group record) ---------------------------------------------------

    function findGroup(id) {
        var screen = getActiveScreen();
        return screen && (screen.groups || []).find(function (g) { return g.id === id; });
    }

    function groupMemberIds(groupId) {
        var screen = getActiveScreen();
        if (!screen) return [];
        return screen.components.filter(function (c) { return c.g === groupId; }).map(function (c) { return c.id; });
    }

    // --- Layers: hierarchical organization + visibility, deliberately NOT
    // z-order (see makeScreen() above — z-order stays the flat `components`
    // array order it already was, no separate concept needed for that).

    function findLayer(id) {
        var screen = getActiveScreen();
        return screen && (screen.layers || []).find(function (l) { return l.id === id; });
    }

    function getLayerChildren(parentId) {
        var screen = getActiveScreen();
        if (!screen) return [];
        return (screen.layers || []).filter(function (l) { return l.parentId === parentId; });
    }

    // A layer is effectively visible only if IT and every ancestor up the
    // chain is visible — hiding a parent hides everything nested under it.
    function isLayerVisible(layerId) {
        var layer = findLayer(layerId);
        while (layer) {
            if (!layer.visible) return false;
            layer = layer.parentId ? findLayer(layer.parentId) : null;
        }
        return true;
    }

    function getComponentsInLayer(layerId) {
        var screen = getActiveScreen();
        if (!screen) return [];
        // Same order as screen.components — that order IS z-order, so a
        // layer's component list is naturally already in z-order too.
        return screen.components.filter(function (c) { return c.layerId === layerId; });
    }

    function addLayer(parentId) {
        var screen = getActiveScreen();
        var layer = { id: genId(), name: "New Layer", parentId: parentId || null, visible: true };
        screen.layers.push(layer);
        markDirty();
        renderLayersPanel();
        return layer;
    }

    function renameLayer(id, name) {
        var layer = findLayer(id);
        if (!layer) return;
        layer.name = name || layer.name;
        markDirty();
    }

    function toggleLayerVisibility(id) {
        var layer = findLayer(id);
        if (!layer) return;
        layer.visible = !layer.visible;
        markDirty();
        renderActiveScreen();
        renderLayersPanel();
    }

    // Deleting a layer reassigns its components AND child layers to its
    // OWN parent (or the screen's first/root layer if it had none) —
    // nothing is ever left pointing at a layer that no longer exists. The
    // very last remaining layer on a screen can't be deleted (every
    // component must always belong to something).
    function deleteLayer(id) {
        var screen = getActiveScreen();
        if (screen.layers.length <= 1) {
            RED.notify("A screen must have at least one layer", { type: "warning", timeout: 2000 });
            return;
        }
        var layer = findLayer(id);
        if (!layer) return;
        var fallbackId = layer.parentId || screen.layers.filter(function (l) { return l.id !== id; })[0].id;
        screen.components.forEach(function (c) { if (c.layerId === id) c.layerId = fallbackId; });
        getLayerChildren(id).forEach(function (child) { child.parentId = layer.parentId; });
        screen.layers = screen.layers.filter(function (l) { return l.id !== id; });
        markDirty();
        renderActiveScreen();
        renderLayersPanel();
    }

    // Z-order lives purely in screen.components' array position (later =
    // painted on top, since renderActiveScreen() just appends each
    // component's element to the artboard in that order — normal DOM
    // stacking already does the rest, no z-index bookkeeping needed).
    function moveComponentZ(id, mode) {
        var screen = getActiveScreen();
        var idx = screen.components.findIndex(function (c) { return c.id === id; });
        if (idx === -1) return;
        var comp = screen.components[idx];
        screen.components.splice(idx, 1);
        if (mode === "front") screen.components.push(comp);
        else if (mode === "back") screen.components.unshift(comp);
        else if (mode === "forward") screen.components.splice(Math.min(idx + 1, screen.components.length), 0, comp);
        else if (mode === "backward") screen.components.splice(Math.max(idx - 1, 0), 0, comp);
        markDirty();
        // renderActiveScreen() clears selectedIds as a side effect — z-order
        // shouldn't lose your selection, so capture it first and restore.
        var keepSelected = selectedIds.slice();
        renderActiveScreen();
        selectMultiple(keepSelected);
        renderLayersPanel();
    }

    function clearSelectionHandles() {
        if (selectionHandlesEl) {
            selectionHandlesEl.remove();
            selectionHandlesEl = null;
        }
    }

    // Updates one component's box/rotation live during a drag, without the
    // full artboard rebuild renderActiveScreen() does — keeps resize/rotate
    // smooth, and keeps the (possibly still-open) selection overlay in sync.
    function updateComponentBox(comp) {
        var el = artboardEl.find('[data-id="' + comp.id + '"]');
        el.css({
            left: comp.x + "px", top: comp.y + "px",
            width: comp.w + "px", height: comp.h + "px",
            transform: "rotate(" + (comp.rotation || 0) + "deg)"
        });
        if (selectionHandlesEl && selectedIds.length === 1 && selectedIds[0] === comp.id) {
            selectionHandlesEl.css({
                left: comp.x + "px", top: comp.y + "px",
                width: comp.w + "px", height: comp.h + "px",
                transform: "rotate(" + (comp.rotation || 0) + "deg)"
            });
        }
    }

    function wireResizeHandle(handle, comp, handleName) {
        handle.get(0).addEventListener("mousedown", function (e) {
            e.stopPropagation();
            e.preventDefault();
            var screen = getActiveScreen();
            var minSize = 20;
            var start = { x: e.clientX, y: e.clientY };
            var orig = { x: comp.x, y: comp.y, w: comp.w, h: comp.h };
            // Resize handles rotate visually with the object (see
            // renderSelectionHandles), so a drag that LOOKS like it's along
            // the object's own edge needs the mouse delta rotated back into
            // the object's local (unrotated) frame before it's applied to
            // w/h — otherwise resize feels wrong on anything rotated.
            var rad = (comp.rotation || 0) * Math.PI / 180;
            var cos = Math.cos(rad), sin = Math.sin(rad);

            function onMove(ev) {
                // Raw mouse deltas are real screen px; the stage they're
                // dragging across is CSS-scaled by zoomLevel, so they must
                // be divided back down to artboard-local px before any of
                // this rotation/resize math (which all operates in local,
                // unscaled units) touches them.
                var dxScreen = (ev.clientX - start.x) / zoomLevel;
                var dyScreen = (ev.clientY - start.y) / zoomLevel;
                var dx = dxScreen * cos + dyScreen * sin;
                var dy = -dxScreen * sin + dyScreen * cos;
                var nx = orig.x, ny = orig.y, nw = orig.w, nh = orig.h;
                if (handleName.indexOf("e") !== -1) nw = Math.max(minSize, orig.w + dx);
                if (handleName.indexOf("s") !== -1) nh = Math.max(minSize, orig.h + dy);
                if (handleName.indexOf("w") !== -1) { nw = Math.max(minSize, orig.w - dx); nx = orig.x + (orig.w - nw); }
                if (handleName.indexOf("n") !== -1) { nh = Math.max(minSize, orig.h - dy); ny = orig.y + (orig.h - nh); }
                if (screen.snap) {
                    nx = snap(nx, screen.gridSize);
                    ny = snap(ny, screen.gridSize);
                    nw = snap(nw, screen.gridSize);
                    nh = snap(nh, screen.gridSize);
                }
                comp.x = nx; comp.y = ny;
                comp.w = Math.max(minSize, nw); comp.h = Math.max(minSize, nh);
                updateComponentBox(comp);
            }
            function onUp() {
                document.removeEventListener("mousemove", onMove);
                document.removeEventListener("mouseup", onUp);
                if (orig.x !== comp.x || orig.y !== comp.y || orig.w !== comp.w || orig.h !== comp.h) {
                    pushHistory({
                        t: "resize", screenId: screen.id, id: comp.id,
                        from: orig, to: { x: comp.x, y: comp.y, w: comp.w, h: comp.h }
                    });
                    markDirty();
                }
            }
            document.addEventListener("mousemove", onMove);
            document.addEventListener("mouseup", onUp);
        });
    }

    function wireRotateHandle(handle, comp) {
        handle.get(0).addEventListener("mousedown", function (e) {
            e.stopPropagation();
            e.preventDefault();
            var screen = getActiveScreen();
            var origRotation = comp.rotation || 0;
            // artboardOffset is a real (post-transform) screen position
            // (jQuery .offset() uses getBoundingClientRect, which already
            // reflects the stage's CSS scale) — comp.x/y/w are artboard-
            // local units, so they need *zoomLevel to land in that same
            // real-screen-px space before the atan2 angle math below.
            var artboardOffset = artboardEl.offset();
            var centerX = artboardOffset.left + (comp.x + comp.w / 2) * zoomLevel;
            var centerY = artboardOffset.top + (comp.y + comp.h / 2) * zoomLevel;
            var startAngle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * 180 / Math.PI;

            function onMove(ev) {
                var angle = Math.atan2(ev.clientY - centerY, ev.clientX - centerX) * 180 / Math.PI;
                var next = origRotation + (angle - startAngle);
                if (ev.shiftKey) next = Math.round(next / 15) * 15;
                comp.rotation = Math.round(next);
                updateComponentBox(comp);
            }
            function onUp() {
                document.removeEventListener("mousemove", onMove);
                document.removeEventListener("mouseup", onUp);
                if (comp.rotation !== origRotation) {
                    pushHistory({ t: "rotate", screenId: screen.id, id: comp.id, from: origRotation, to: comp.rotation });
                    markDirty();
                }
            }
            document.addEventListener("mousemove", onMove);
            document.addEventListener("mouseup", onUp);
        });
    }

    function renderSelectionHandles(comp) {
        clearSelectionHandles();
        var typeDef = NEXA.getComponent(comp.type);
        var caps = (typeDef && typeDef.capabilities) || {};

        selectionHandlesEl = $("<div>", { "class": "nexa-selection-handles" }).css({
            position: "absolute",
            left: comp.x + "px", top: comp.y + "px",
            width: comp.w + "px", height: comp.h + "px",
            "pointer-events": "none",
            transform: "rotate(" + (comp.rotation || 0) + "deg)"
        }).appendTo(artboardEl);

        if (!comp.locked) {
            if (caps.resizable) {
                [
                    { n: "nw", x: 0, y: 0, cursor: "nwse-resize" },
                    { n: "n", x: 0.5, y: 0, cursor: "ns-resize" },
                    { n: "ne", x: 1, y: 0, cursor: "nesw-resize" },
                    { n: "e", x: 1, y: 0.5, cursor: "ew-resize" },
                    { n: "se", x: 1, y: 1, cursor: "nwse-resize" },
                    { n: "s", x: 0.5, y: 1, cursor: "ns-resize" },
                    { n: "sw", x: 0, y: 1, cursor: "nesw-resize" },
                    { n: "w", x: 0, y: 0.5, cursor: "ew-resize" }
                ].forEach(function (p) {
                    // The box/margin above is in artboard-LOCAL units, so it
                    // already scales (and stays correctly centered on the
                    // right corner point) along with the component under
                    // the stage's own zoom transform — but that also means
                    // its on-screen SIZE would grow/shrink with zoom, unlike
                    // every real design tool's handles (Figma, Illustrator,
                    // Node-RED's own port dots), which stay a constant
                    // physical size regardless of canvas zoom. Countering
                    // with scale(1/zoomLevel), around the handle's own
                    // center (the default transform-origin, which is
                    // exactly the corner point thanks to the margin
                    // trick above), fixes the size without moving that
                    // anchor point.
                    var handle = $("<div>", { "class": "nexa-resize-handle" }).css({
                        position: "absolute",
                        left: (p.x * 100) + "%", top: (p.y * 100) + "%",
                        width: HANDLE_SIZE + "px", height: HANDLE_SIZE + "px",
                        margin: (-HANDLE_SIZE / 2) + "px 0 0 " + (-HANDLE_SIZE / 2) + "px",
                        background: "#fff", border: "1px solid #ff5722", "box-sizing": "border-box",
                        cursor: p.cursor, "pointer-events": "auto",
                        transform: "scale(" + (1 / zoomLevel) + ")"
                    }).appendTo(selectionHandlesEl);
                    wireResizeHandle(handle, comp, p.n);
                });
            }
            if (caps.rotatable) {
                // Same zoom-compensation idea as the resize handles above,
                // plus the connecting line's own offset/length are divided
                // by zoomLevel too, so the rotate handle floats a constant
                // *visual* distance above the box at any zoom (rather than
                // stretching further away as you zoom in).
                $("<div>").css({
                    position: "absolute", left: "50%", top: (-24 / zoomLevel) + "px",
                    width: "1px", height: (24 / zoomLevel) + "px", background: "#ff5722", "pointer-events": "none"
                }).appendTo(selectionHandlesEl);
                var rotHandle = $("<div>", { "class": "nexa-rotate-handle" }).css({
                    position: "absolute",
                    left: "50%", top: (-24 / zoomLevel) + "px",
                    width: HANDLE_SIZE + "px", height: HANDLE_SIZE + "px",
                    margin: (-HANDLE_SIZE / 2) + "px 0 0 " + (-HANDLE_SIZE / 2) + "px",
                    background: "#fff", border: "1px solid #ff5722", "border-radius": "50%",
                    cursor: "grab", "pointer-events": "auto",
                    transform: "scale(" + (1 / zoomLevel) + ")"
                }).appendTo(selectionHandlesEl);
                wireRotateHandle(rotHandle, comp);
            }
        }

        if (caps.lockable !== false) {
            var lockIcon = $("<div>", { "class": "nexa-lock-handle" }).css({
                position: "absolute", right: (-22 / zoomLevel) + "px", top: (-22 / zoomLevel) + "px",
                width: "16px", height: "16px", background: "#fff", border: "1px solid #999",
                "border-radius": "3px", cursor: "pointer", "pointer-events": "auto",
                "font-size": "10px", "text-align": "center", "line-height": "15px", color: "#666",
                transform: "scale(" + (1 / zoomLevel) + ")"
            }).html(comp.locked ? '<i class="fa fa-lock"></i>' : '<i class="fa fa-unlock-alt"></i>').appendTo(selectionHandlesEl);
            lockIcon.on("click", function (e) {
                e.stopPropagation();
                setLockedForSelection(!comp.locked, [comp.id]);
            });
        }
    }

    // --- Selection model (multi-select) ---------------------------------
    // Plain array, not a Set — selection sizes here are always small, and
    // an array keeps "is exactly one selected" (single.length===1) and
    // iteration trivial without Set/Array conversions everywhere.

    function isSelected(id) {
        return selectedIds.indexOf(id) !== -1;
    }

    function refreshSelectionVisuals() {
        if (!artboardEl) return;
        artboardEl.find(".nexa-component").css("outline", "none");
        selectedIds.forEach(function (id) {
            artboardEl.find('[data-id="' + id + '"]').css("outline", "2px solid #ff5722");
        });
        // Resize/rotate handles only make sense for exactly one selected
        // item for now (group-resize is a fair bit more math — bounding-box
        // handles that scale every member proportionally — deferred until
        // grouping itself exists, which needs a firm bounding box concept
        // anyway).
        clearSelectionHandles();
        if (selectedIds.length === 1) {
            var comp = findComponent(selectedIds[0]);
            if (comp) renderSelectionHandles(comp);
        }
        renderPropertiesPanel();
        refreshEventsHighlight();
    }

    function selectOnly(id) {
        selectedIds = [id];
        refreshSelectionVisuals();
    }

    function addToSelection(id) {
        if (!isSelected(id)) selectedIds.push(id);
        refreshSelectionVisuals();
    }

    function removeFromSelection(id) {
        selectedIds = selectedIds.filter(function (x) { return x !== id; });
        refreshSelectionVisuals();
    }

    function selectMultiple(ids) {
        selectedIds = ids.slice();
        refreshSelectionVisuals();
    }

    // v1 deliberately doesn't support nested/re-grouping — a member already
    // in a group must be ungrouped first. That keeps the undo/redo shape
    // simple (group/ungroup are exact inverses of each other, see
    // applyHistoryMutation) instead of needing to track/restore a previous
    // group membership per member.
    function groupSelection() {
        if (selectedIds.length < 2) {
            RED.notify("Select at least 2 components to group", { type: "warning", timeout: 2000 });
            return;
        }
        var screen = getActiveScreen();
        screen.groups = screen.groups || [];
        var members = selectedIds.map(findComponent).filter(Boolean);
        if (members.some(function (c) { return c.g; })) {
            RED.notify("One or more selected components are already in a group — ungroup first", { type: "warning", timeout: 2500 });
            return;
        }
        var minX = Math.min.apply(null, members.map(function (c) { return c.x; }));
        var minY = Math.min.apply(null, members.map(function (c) { return c.y; }));
        var maxX = Math.max.apply(null, members.map(function (c) { return c.x + c.w; }));
        var maxY = Math.max.apply(null, members.map(function (c) { return c.y + c.h; }));
        var pad = 10;
        var group = { id: genId(), x: minX - pad, y: minY - pad, w: (maxX - minX) + pad * 2, h: (maxY - minY) + pad * 2 };
        var memberIds = members.map(function (c) { return c.id; });

        screen.groups.push(group);
        memberIds.forEach(function (id) { var c = findComponent(id); if (c) c.g = group.id; });
        pushHistory({ t: "group", screenId: screen.id, group: group, memberIds: memberIds });
        markDirty();
        renderActiveScreen();
        selectMultiple(memberIds);
    }

    function ungroupSelection() {
        var screen = getActiveScreen();
        var groupIds = {};
        selectedIds.forEach(function (id) {
            var c = findComponent(id);
            if (c && c.g) groupIds[c.g] = true;
        });
        var ids = Object.keys(groupIds);
        if (!ids.length) return;
        var ungroupEvents = [];
        var allMemberIds = [];
        ids.forEach(function (gid) {
            var group = findGroup(gid);
            if (!group) return;
            var memberIds = groupMemberIds(gid);
            ungroupEvents.push({ t: "ungroup", screenId: screen.id, group: group, memberIds: memberIds });
            memberIds.forEach(function (id) { var c = findComponent(id); if (c) delete c.g; });
            screen.groups = (screen.groups || []).filter(function (g) { return g.id !== gid; });
            allMemberIds = allMemberIds.concat(memberIds);
        });
        if (!ungroupEvents.length) return;
        pushHistory(ungroupEvents.length === 1 ? ungroupEvents[0] : { t: "multi", screenId: screen.id, events: ungroupEvents });
        markDirty();
        renderActiveScreen();
        selectMultiple(allMemberIds);
    }

    // --- Copy / cut / paste. Same shape as @node-red/editor-client's own
    // view.js clipboard (internal `clipboard`/`clipboardSource` vars, IDs
    // regenerated only on copy-paste, never on cut-paste — see the plan
    // doc's reference notes) — reimplemented here since components aren't
    // Node-RED nodes and RED.nodes.createExportableNodeSet doesn't apply.
    var clipboard = null; // array of cloned component objects
    var clipboardSource = null; // "copy" | "cut"
    var clipboardFullGroups = null; // {groupId: true} — only groups where EVERY member was selected at copy time

    function copySelection(isCut) {
        if (!selectedIds.length) return;
        var members = selectedIds.map(findComponent).filter(Boolean);
        if (!members.length) return;

        var touchedGroups = {};
        members.forEach(function (c) { if (c.g) touchedGroups[c.g] = true; });
        var fullGroups = {};
        Object.keys(touchedGroups).forEach(function (gid) {
            var allMembers = groupMemberIds(gid);
            var selectedMembers = allMembers.filter(function (id) { return selectedIds.indexOf(id) !== -1; });
            if (allMembers.length && selectedMembers.length === allMembers.length) fullGroups[gid] = true;
        });

        clipboard = JSON.parse(JSON.stringify(members));
        clipboardFullGroups = fullGroups;
        clipboardSource = isCut ? "cut" : "copy";

        if (isCut) {
            removeComponents(selectedIds.slice());
        }
    }

    function pasteClipboard() {
        if (!clipboard || !clipboard.length) return;
        var screen = getActiveScreen();
        screen.groups = screen.groups || [];
        var regenerateIds = clipboardSource === "copy";
        var groupIdMap = {};

        var newComps = clipboard.map(function (c) {
            var copy = JSON.parse(JSON.stringify(c));
            copy.id = regenerateIds ? genId() : copy.id;
            if (regenerateIds) {
                copy.x += 20;
                copy.y += 20;
            }
            return copy;
        });

        newComps.forEach(function (copy) {
            if (!copy.g) return;
            if (!clipboardFullGroups[copy.g]) {
                delete copy.g; // partial group membership — don't dangle-reference a group that won't have every member
            } else if (regenerateIds) {
                if (!groupIdMap[copy.g]) groupIdMap[copy.g] = genId();
                copy.g = groupIdMap[copy.g];
            }
            // else: cut-paste of a fully-grouped set keeps the original
            // group id as-is — removeComponents() only ever removes
            // components, never the group record itself, so the original
            // group is still there, untouched, waiting for its members back.
        });

        Object.keys(groupIdMap).forEach(function (oldGid) {
            var original = (screen.groups || []).find(function (g) { return g.id === oldGid; });
            var newGroup = original ? JSON.parse(JSON.stringify(original)) : { x: 0, y: 0, w: 0, h: 0 };
            newGroup.id = groupIdMap[oldGid];
            screen.groups.push(newGroup);
        });

        newComps.forEach(function (copy) { screen.components.push(copy); });
        newComps.forEach(renderComponent);

        if (newComps.length === 1) {
            pushHistory({ t: "add", screenId: screen.id, comp: newComps[0] });
        } else {
            pushHistory({ t: "multi", screenId: screen.id, events: newComps.map(function (c) { return { t: "add", screenId: screen.id, comp: c }; }) });
        }
        markDirty();
        selectMultiple(newComps.map(function (c) { return c.id; }));

        // A second Ctrl+V after a cut should duplicate what was just pasted,
        // not fail/collide trying to re-paste the same (now already placed)
        // ids again — flip to copy semantics after the first paste of a cut.
        if (clipboardSource === "cut") {
            clipboard = newComps;
            clipboardFullGroups = {};
            newComps.forEach(function (c) { if (c.g) clipboardFullGroups[c.g] = true; });
            clipboardSource = "copy";
        }
    }

    function deselectAll() {
        selectedIds = [];
        refreshSelectionVisuals();
    }

    // Rubber-band/marquee select — mousedown on empty artboard (not on a
    // component, see the artboard's own mousedown handler) starts a
    // dashed selection rectangle; anything whose bounding box intersects
    // it on mouseup gets selected. Same AABB-overlap test view.js's own
    // lasso select uses, reimplemented here in plain mouse events since
    // components are absolutely-positioned divs, not an SVG/D3 scene.
    function startMarqueeSelect(e) {
        // marqueeEl is appended INSIDE artboardEl, which sits under the
        // scaled stage — so its own left/top/width/height must be in the
        // same artboard-local units as components (dividing the real-
        // screen-px mouse offset by zoomLevel), both so it's drawn at the
        // right visual size (the ancestor transform re-scales it) and so
        // the hit-test below compares apples to apples against c.x/c.y/w/h.
        var offset = artboardEl.offset();
        var startX = (e.pageX - offset.left) / zoomLevel;
        var startY = (e.pageY - offset.top) / zoomLevel;
        var box = { left: startX, top: startY, width: 0, height: 0 };
        var shiftHeld = e.shiftKey;

        var marqueeEl = $("<div>", { "class": "nexa-marquee" }).css({
            position: "absolute", left: startX + "px", top: startY + "px",
            width: "0px", height: "0px",
            border: "1px dashed #2196f3", background: "rgba(33,150,243,0.1)",
            "pointer-events": "none", "z-index": 999
        }).appendTo(artboardEl);

        function onMove(ev) {
            var curX = (ev.pageX - offset.left) / zoomLevel;
            var curY = (ev.pageY - offset.top) / zoomLevel;
            box.left = Math.min(startX, curX);
            box.top = Math.min(startY, curY);
            box.width = Math.abs(curX - startX);
            box.height = Math.abs(curY - startY);
            marqueeEl.css({ left: box.left + "px", top: box.top + "px", width: box.width + "px", height: box.height + "px" });
        }
        function onUp() {
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup", onUp);
            marqueeEl.remove();
            if (box.width < 3 && box.height < 3) return; // treat as a plain click on empty space, not a drag
            var screen = getActiveScreen();
            var hits = screen.components.filter(function (c) {
                return !(c.x > box.left + box.width || c.x + c.w < box.left || c.y > box.top + box.height || c.y + c.h < box.top);
            }).map(function (c) { return c.id; });
            if (shiftHeld) {
                hits.forEach(function (id) { if (!isSelected(id)) selectedIds.push(id); });
                refreshSelectionVisuals();
            } else {
                selectMultiple(hits);
            }
        }
        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onUp);
    }

    // Re-invokes just one component's render() with its current props —
    // the contract's own "called again whenever props change" rule (see
    // the component-plugin design notes) — no full artboard rebuild needed.
    function refreshComponentRender(comp) {
        if (!artboardEl) return;
        var el = artboardEl.find('[data-id="' + comp.id + '"]');
        var node = el && el.get && el.get(0);
        if (!node) return;
        var typeDef = NEXA.getComponent(comp.type);
        if (!typeDef || typeof typeDef.render !== "function") return;
        try {
            typeDef.render(node, comp.props || {}, {
                // Editor-only preview: logged, but NOT run through
                // screen.logic — see the big comment on findLogicNode below
                // for why the Logic canvas never executes here.
                emit: function (eventName, payload) {
                    if (RED.log) RED.log.info("[kufayeka-nexa-dashboard] component event: " + comp.type + "#" + comp.id + " " + eventName + " " + JSON.stringify(payload));
                }
            });
        } catch (e) {
            el.text("(render error: " + e.message + ")");
        }
    }

    // --- Per-screen logic (design-time): the Logic canvas here is PURELY
    // an editor for screen.logic (nodes/wires/config) — it never executes
    // any of it. An earlier version did run the graph live while editing
    // (onload/onrender on tray open, ctx.emit wired straight through), but
    // that meant designing a screen had side effects happening *as you
    // wired things up* — confusing, and not how a design surface should
    // behave (Node-RED's own flow editor doesn't run your flow just
    // because the tab is open, either). Actual execution now lives ONLY on
    // the deployed page (lib/nexa-runtime-client.js's own runLogicGraph) —
    // that engine is a close relative of this comment's old contents, not
    // a copy-paste twin, since it also has to run headless (no jQuery, no
    // tray) and support async Function nodes (fetch, etc).

    function findLogicNode(screen, id) {
        return (screen.logic.nodes || []).find(function (n) { return n.id === id; });
    }

    // Locks/unlocks every currently-selected component at once ("lock
    // bareng"). renderActiveScreen() (needed since lock changes which
    // handles/draggable wiring a component gets) resets selectedIds as a
    // side effect, so the ids are captured up front and the selection is
    // restored afterwards. Not pushed onto the undo stack — same as the
    // single lock icon's own toggle, which never has been either.
    function setLockedForSelection(locked, idsOverride) {
        var ids = idsOverride || selectedIds.slice();
        var changed = false;
        ids.forEach(function (id) {
            var c = findComponent(id);
            if (c && c.locked !== locked) { c.locked = locked; changed = true; }
        });
        if (!changed) return;
        markDirty();
        renderActiveScreen();
        selectMultiple(ids);
    }

    // --- Sidebar: Component Properties tab — dynamically shows whatever is
    // currently selected on the canvas, live-updating (no dialog, same
    // inline-edit philosophy as the Screens tab's own settings form).
    // --- Sidebar: Layers tab — hierarchical layer tree (visibility +
    // add/rename/delete) with each layer's components listed underneath in
    // z-order, plus per-component z-order controls. Component-to-layer
    // (re)assignment happens from the Properties tab instead of by
    // dragging here — see the "Layer" field in renderPropertiesPanel.
    function renderLayersPanel() {
        if (!layersPane) return;
        layersPane.empty();
        var screen = getActiveScreen();
        if (!screen) return;

        function renderLayerNode(layer, depth) {
            var row = $("<div>").css({
                display: "flex", "align-items": "center", gap: "4px",
                "margin-left": (depth * 14) + "px", "margin-bottom": "2px", "font-size": "12px"
            }).appendTo(layersPane);

            $("<span>", { style: "cursor:pointer; width:16px; text-align:center;" })
                .html(layer.visible ? '<i class="fa fa-eye"></i>' : '<i class="fa fa-eye-slash"></i>')
                .css({ color: layer.visible ? "#333" : "#bbb" })
                .on("click", function () { toggleLayerVisibility(layer.id); })
                .appendTo(row);

            var nameEl = $("<span>", { style: "flex:1; cursor:text;" }).text(layer.name).appendTo(row);
            nameEl.on("click", function () {
                var input = $("<input>", { type: "text" }).val(layer.name).css({ width: "100%", "box-sizing": "border-box" });
                nameEl.empty().append(input);
                if (input.get && input.get(0) && input.get(0).focus) input.get(0).focus();
                input.on("blur", function () {
                    renameLayer(layer.id, input.val());
                    renderLayersPanel();
                });
            });

            $("<a>", { href: "#", title: "Add sub-layer" }).html('<i class="fa fa-plus"></i>').css({ color: "#888" })
                .on("click", function (e) { e.preventDefault(); addLayer(layer.id); }).appendTo(row);

            if (screen.layers.length > 1) {
                $("<a>", { href: "#", title: "Delete layer" }).html('<i class="fa fa-trash"></i>').css({ color: "#888" })
                    .on("click", function (e) { e.preventDefault(); deleteLayer(layer.id); }).appendTo(row);
            }

            // Reversed for display only (top of list = front-most, the
            // Photoshop/Figma convention) — the underlying screen.
            // components array order (back-to-front) stays the real
            // source of truth for z-order.
            getComponentsInLayer(layer.id).slice().reverse().forEach(function (comp) {
                var typeDef = NEXA.getComponent(comp.type);
                var compRow = $("<div>").css({
                    display: "flex", "align-items": "center", gap: "3px", color: "#555",
                    "margin-left": ((depth + 1) * 14) + "px", "margin-bottom": "2px", "font-size": "12px"
                }).appendTo(layersPane);
                $("<span>", { style: "flex:1; cursor:pointer;" }).text(typeDef ? typeDef.label : comp.type)
                    .on("click", function () { selectOnly(comp.id); }).appendTo(compRow);
                [
                    ["front", "fa-angle-double-up", "Bring to front"],
                    ["forward", "fa-angle-up", "Bring forward"],
                    ["backward", "fa-angle-down", "Send backward"],
                    ["back", "fa-angle-double-down", "Send to back"]
                ].forEach(function (btn) {
                    $("<a>", { href: "#", title: btn[2] }).html('<i class="fa ' + btn[1] + '"></i>')
                        .on("click", function (e) { e.preventDefault(); moveComponentZ(comp.id, btn[0]); }).appendTo(compRow);
                });
            });

            getLayerChildren(layer.id).forEach(function (child) { renderLayerNode(child, depth + 1); });
        }

        getLayerChildren(null).forEach(function (layer) { renderLayerNode(layer, 0); });

        $("<button>", { type: "button" }).text("+ Add Layer").css({ width: "100%", "margin-top": "8px" })
            .on("click", function () { addLayer(null); }).appendTo(layersPane);
    }

    function renderPropertiesPanel() {
        if (!propertiesPane) return;
        propertiesPane.empty();
        if (selectedIds.length > 1) {
            $("<div>").css({ color: "#666", "font-size": "12px", "margin-bottom": "10px" }).text(selectedIds.length + " components selected.").appendTo(propertiesPane);

            var isOneWholeGroup = (function () {
                var first = findComponent(selectedIds[0]);
                if (!first || !first.g) return false;
                var members = groupMemberIds(first.g);
                return members.length === selectedIds.length && members.every(isSelected);
            })();
            var groupRow = $("<div>").css({ display: "flex", gap: "6px", "margin-bottom": "6px" }).appendTo(propertiesPane);
            if (isOneWholeGroup) {
                $("<button>", { type: "button" }).text("Ungroup").css({ flex: "1" }).on("click", ungroupSelection).appendTo(groupRow);
            } else {
                $("<button>", { type: "button" }).text("Group").css({ flex: "1" }).on("click", groupSelection).appendTo(groupRow);
            }

            var lockRow = $("<div>").css({ display: "flex", gap: "6px" }).appendTo(propertiesPane);
            $("<button>", { type: "button" }).text("Lock all").css({ flex: "1" })
                .on("click", function () { setLockedForSelection(true); }).appendTo(lockRow);
            $("<button>", { type: "button" }).text("Unlock all").css({ flex: "1" })
                .on("click", function () { setLockedForSelection(false); }).appendTo(lockRow);
            return;
        }
        var comp = selectedIds.length === 1 ? findComponent(selectedIds[0]) : null;
        if (!comp) {
            $("<div>").css({ color: "#999", "font-size": "12px" }).text("Select a component on the canvas to edit its properties.").appendTo(propertiesPane);
            return;
        }
        var typeDef = NEXA.getComponent(comp.type);
        if (!typeDef) {
            $("<div>").css({ color: "#a00", "font-size": "12px" }).text("Unknown component type: " + comp.type).appendTo(propertiesPane);
            return;
        }

        $("<div>").css({ "font-weight": "bold", "font-size": "12px", "margin-bottom": "8px" }).text(typeDef.label || comp.type).appendTo(propertiesPane);

        var lockRow = $("<div>").css({ "margin-bottom": "10px" }).appendTo(propertiesPane);
        var lockInput = $("<input>", { type: "checkbox" }).prop("checked", !!comp.locked).css({ "margin-right": "6px" });
        lockRow.append(lockInput).append($("<label>").css({ "font-size": "11px", color: "#888" }).text("Locked"));
        lockInput.on("change", function () {
            setLockedForSelection(lockInput.is(":checked"), [comp.id]);
        });

        var layerRow = $("<div>").css({ "margin-bottom": "10px" }).appendTo(propertiesPane);
        $("<label>").css({ display: "block", "font-size": "11px", "margin-bottom": "2px", color: "#888" }).text("Layer").appendTo(layerRow);
        var layerSelect = $("<select>").css({ width: "100%" }).appendTo(layerRow);
        (function buildLayerOptions(parentId, depth) {
            getLayerChildren(parentId).forEach(function (layer) {
                $("<option>", { value: layer.id }).text(new Array(depth + 1).join("— ") + layer.name)
                    .prop("selected", comp.layerId === layer.id).appendTo(layerSelect);
                buildLayerOptions(layer.id, depth + 1);
            });
        })(null, 0);
        layerSelect.on("change", function () {
            comp.layerId = layerSelect.val();
            markDirty();
            renderActiveScreen();
            selectOnly(comp.id);
        });

        var defaults = typeDef.defaults || {};
        Object.keys(defaults).forEach(function (key) {
            var fieldDef = defaults[key] || {};
            var inputType = fieldDef.type === "number" ? "number" : fieldDef.type === "color" ? "color" : fieldDef.type === "checkbox" ? "checkbox" : "text";
            var row = $("<div>").css({ "margin-bottom": "8px" }).appendTo(propertiesPane);
            $("<label>").css({ display: "block", "font-size": "11px", "margin-bottom": "2px", color: "#888" }).text(key).appendTo(row);

            var input;
            if (inputType === "checkbox") {
                input = $("<input>", { type: "checkbox" }).prop("checked", !!comp.props[key]).appendTo(row);
            } else {
                input = $("<input>", { type: inputType }).css({ width: "100%", "box-sizing": "border-box" }).val(comp.props[key]).appendTo(row);
            }
            input.on("change", function () {
                var v = inputType === "checkbox" ? input.is(":checked") : inputType === "number" ? (parseFloat(input.val()) || 0) : input.val();
                comp.props[key] = v;
                refreshComponentRender(comp);
                markDirty();
            });
        });

        $("<div>").css({ "font-weight": "bold", "font-size": "12px", margin: "14px 0 8px", "border-top": "1px solid #ddd", "padding-top": "10px" }).text("Position & Size").appendTo(propertiesPane);
        [["x", "X"], ["y", "Y"], ["w", "Width"], ["h", "Height"], ["rotation", "Rotation"]].forEach(function (pair) {
            var field = pair[0], label = pair[1];
            var row = $("<div>").css({ "margin-bottom": "8px" }).appendTo(propertiesPane);
            $("<label>").css({ display: "block", "font-size": "11px", "margin-bottom": "2px", color: "#888" }).text(label).appendTo(row);
            var input = $("<input>", { type: "number" }).css({ width: "100%", "box-sizing": "border-box" }).val(comp[field]).prop("disabled", comp.locked).appendTo(row);
            input.on("change", function () {
                comp[field] = parseFloat(input.val()) || 0;
                updateComponentBox(comp);
                markDirty();
            });
        });
    }

    function removeComponents(ids) {
        var screen = getActiveScreen();
        var toRemove = ids
            .map(function (id) { return screen.components.find(function (c) { return c.id === id; }); })
            .filter(function (c) { return c && !c.locked; });
        if (!toRemove.length) return;
        var removeIds = toRemove.map(function (c) { return c.id; });
        screen.components = screen.components.filter(function (c) { return removeIds.indexOf(c.id) === -1; });
        removeIds.forEach(function (id) { artboardEl.find('[data-id="' + id + '"]').remove(); });
        selectedIds = selectedIds.filter(function (id) { return removeIds.indexOf(id) === -1; });
        refreshSelectionVisuals();
        if (toRemove.length === 1) {
            pushHistory({ t: "delete", screenId: screen.id, comp: toRemove[0] });
        } else {
            pushHistory({ t: "multi", screenId: screen.id, events: toRemove.map(function (c) { return { t: "delete", screenId: screen.id, comp: c }; }) });
        }
        markDirty();
    }

    function renderComponent(comp) {
        var screen = getActiveScreen();
        var dragStart = null;
        var typeDef = NEXA.getComponent(comp.type);
        var el = $("<div>", { "data-id": comp.id, "class": "nexa-component" }).css({
            position: "absolute",
            left: comp.x + "px",
            top: comp.y + "px",
            width: comp.w + "px",
            height: comp.h + "px",
            transform: "rotate(" + (comp.rotation || 0) + "deg)",
            "box-sizing": "border-box",
            cursor: comp.locked ? "default" : "move",
            "user-select": "none",
            display: isLayerVisible(comp.layerId) ? "" : "none"
        }).appendTo(artboardEl);

        if (typeDef && typeof typeDef.render === "function") {
            try {
                typeDef.render(el.get(0), comp.props || {}, {
                    // Editor-only: logged for visibility/debugging, but
                    // deliberately NOT run through screen.logic — the
                    // Logic canvas is a pure editor for the graph, it never
                    // executes it (see findLogicNode's comment). Actual
                    // execution happens only on the deployed page.
                    emit: function (eventName, payload) {
                        if (RED.log) RED.log.info("[kufayeka-nexa-dashboard] component event: " + comp.type + "#" + comp.id + " " + eventName + " " + JSON.stringify(payload));
                    }
                });
            } catch (e) {
                el.text("(render error: " + e.message + ")").css({ color: "#a00", "font-size": "11px", background: "#fee", padding: "4px" });
            }
        } else {
            el.text("(unknown component: " + comp.type + ")").css({ color: "#a00", "font-size": "11px", background: "#fee", padding: "4px" });
        }

        el.on("mousedown", function (e) {
            e.stopPropagation();
            // Clicking a component that belongs to a group (comp.g) treats
            // the whole group as one selection unit — v1 has no "enter the
            // group" mode to select an individual member, ungroup for that.
            var targetIds = comp.g ? groupMemberIds(comp.g) : [comp.id];
            var alreadyAllSelected = targetIds.every(isSelected);
            if (e.shiftKey) {
                if (alreadyAllSelected) {
                    selectedIds = selectedIds.filter(function (id) { return targetIds.indexOf(id) === -1; });
                } else {
                    targetIds.forEach(function (id) { if (!isSelected(id)) selectedIds.push(id); });
                }
                refreshSelectionVisuals();
            } else if (!alreadyAllSelected) {
                // Clicking an item already part of a multi-selection, with
                // no shift, leaves the whole (super-)selection alone — so
                // the drag that (maybe) follows moves everyone together.
                // Standard convention (Figma/PowerPoint/Node-RED's own flow
                // canvas all work this way).
                selectMultiple(targetIds);
            }
        });

        if (!comp.locked) {
            var groupStart = null; // {id: {x,y}, ...} for every selected item, captured at drag start
            var dragStartPage = null; // {x,y} = the ORIGINAL mousedown's pageX/pageY (real, unscaled screen px)
            // jQuery UI's own ui.position is computed from its internal
            // _generatePosition() math, which assumes an unscaled ancestor
            // chain — under our CSS-scaled stage that comes out wrong (and
            // in a way that compounds every frame). So it's never trusted
            // as an INPUT here — instead the raw mouse event's pageX/pageY
            // (always real, physical screen px, unaffected by any ancestor
            // transform) is read directly, and the delta divided by
            // zoomLevel to land back in artboard-local units.
            //
            // IMPORTANT: jQuery UI's own _mouseDrag runs
            // `this._trigger("drag", event, ui)` (our callback) and only
            // AFTER it returns does `this.helper[0].style.left =
            // this.position.left + "px"` (helper === this element itself,
            // since no `helper` option is set) — i.e. it writes to this
            // element's CSS unconditionally right after our callback, using
            // `this.position = ui.position`. Calling el.css() inside our
            // own drag callback (an earlier, WRONG attempt at this fix)
            // therefore gets silently clobbered a moment later by jQuery
            // UI's own broken value — the fix is to MUTATE ui.position in
            // place instead, so jQuery UI's own follow-up write applies
            // OUR corrected numbers. containment/grid are meaningless
            // (jQuery UI would apply them to the same, still-wrong,
            // unscaled math) so neither option is passed anymore — the
            // manual clamp/snap below fully replaces them.
            el.draggable({
                start: function (e) {
                    if (!isSelected(comp.id)) selectOnly(comp.id);
                    dragStart = { x: comp.x, y: comp.y };
                    dragStartPage = { x: e.pageX, y: e.pageY };
                    groupStart = {};
                    selectedIds.forEach(function (id) {
                        var c = findComponent(id);
                        if (c) groupStart[id] = { x: c.x, y: c.y };
                    });
                },
                // jQuery UI only moves THIS wrapper element during drag; the
                // rest of a multi-selection and the selection/handles
                // overlay (a separate sibling element, see
                // renderSelectionHandles) have no idea a drag is happening
                // — without this they stay frozen at the pre-drag position
                // while this one visibly moves away from under them.
                drag: function (e, ui) {
                    var localLeft = dragStart.x + (e.pageX - dragStartPage.x) / zoomLevel;
                    var localTop = dragStart.y + (e.pageY - dragStartPage.y) / zoomLevel;
                    // Unconditional, matching the jQuery UI grid:[...]
                    // option this replaces (which also snapped regardless
                    // of the screen.snap checkbox — resize/placement are
                    // the two spots that actually respect that flag).
                    localLeft = snap(localLeft, screen.gridSize);
                    localTop = snap(localTop, screen.gridSize);
                    // Replaces jQuery UI's own containment:"parent" option
                    // (dropped along with `ui.position` above, since it's
                    // computed off the same unscaled-ancestor assumption) —
                    // keeps the dragged item's box within the artboard.
                    localLeft = Math.max(0, Math.min(localLeft, screen.width - comp.w));
                    localTop = Math.max(0, Math.min(localTop, screen.height - comp.h));
                    // See the big comment above the .draggable() call: this
                    // MUST be a mutation of ui.position, not el.css(), or
                    // jQuery UI's own next line overwrites it right back.
                    ui.position.left = localLeft;
                    ui.position.top = localTop;
                    if (selectionHandlesEl && selectedIds.length === 1 && selectedIds[0] === comp.id) {
                        selectionHandlesEl.css({ left: localLeft + "px", top: localTop + "px" });
                    }
                    var dx = localLeft - dragStart.x;
                    var dy = localTop - dragStart.y;
                    selectedIds.forEach(function (id) {
                        if (id === comp.id) return; // jQuery UI already moved this one
                        var c = findComponent(id);
                        var start = groupStart[id];
                        if (!c || !start) return;
                        c.x = start.x + dx;
                        c.y = start.y + dy;
                        updateComponentBox(c);
                    });
                },
                stop: function (e) {
                    var localLeft = dragStart.x + (e.pageX - dragStartPage.x) / zoomLevel;
                    var localTop = dragStart.y + (e.pageY - dragStartPage.y) / zoomLevel;
                    // Unconditional, matching the jQuery UI grid:[...]
                    // option this replaces (which also snapped regardless
                    // of the screen.snap checkbox — resize/placement are
                    // the two spots that actually respect that flag).
                    localLeft = snap(localLeft, screen.gridSize);
                    localTop = snap(localTop, screen.gridSize);
                    localLeft = Math.max(0, Math.min(localLeft, screen.width - comp.w));
                    localTop = Math.max(0, Math.min(localTop, screen.height - comp.h));
                    comp.x = localLeft;
                    comp.y = localTop;
                    updateComponentBox(comp); // final correction, same reason as the drag: callback's el.css() override above
                    var moved = [];
                    selectedIds.forEach(function (id) {
                        var c = findComponent(id);
                        var start = groupStart[id];
                        if (!c || !start) return;
                        if (start.x !== c.x || start.y !== c.y) {
                            moved.push({ id: id, from: start, to: { x: c.x, y: c.y } });
                        }
                    });
                    if (moved.length === 1) {
                        pushHistory({ t: "move", screenId: screen.id, id: moved[0].id, from: moved[0].from, to: moved[0].to });
                    } else if (moved.length > 1) {
                        pushHistory({
                            t: "multi", screenId: screen.id,
                            events: moved.map(function (m) { return { t: "move", screenId: screen.id, id: m.id, from: m.from, to: m.to }; })
                        });
                    }
                    if (moved.length) markDirty();
                }
            });
        }
    }

    function addComponentAt(type, artboardX, artboardY) {
        var screen = getActiveScreen();
        var def = NEXA.getComponent(type);
        if (!def) return;
        var size = def.defaultSize || { w: 100, h: 60 };
        var props = {};
        Object.keys(def.defaults || {}).forEach(function (k) {
            props[k] = def.defaults[k].value;
        });
        var comp = {
            id: genId(),
            type: type,
            x: Math.max(0, screen.snap ? snap(artboardX - size.w / 2, screen.gridSize) : artboardX - size.w / 2),
            y: Math.max(0, screen.snap ? snap(artboardY - size.h / 2, screen.gridSize) : artboardY - size.h / 2),
            w: size.w,
            h: size.h,
            rotation: 0,
            locked: false,
            layerId: (screen.layers[0] || {}).id,
            props: props
        };
        screen.components.push(comp);
        renderComponent(comp);
        selectOnly(comp.id);
        pushHistory({ t: "add", screenId: screen.id, comp: comp });
        markDirty();
    }

    // Palette lives in the sidebar (built once, persists across tray
    // open/close) — dropping only does something while the canvas tray is
    // open, since that's the only place with a live artboard to drop onto.
    // Rebuilt (not just built once) from every safe, user-triggered call
    // site — see the comment on componentsPane above for why.
    function buildPalette(paletteEl) {
        paletteEl.empty();
        var components = NEXA.getComponents();
        if (!components.length) {
            $("<div>").css({ color: "#999", "font-size": "12px" }).text("No components registered.").appendTo(paletteEl);
            return;
        }
        components.forEach(function (def) {
            var chip = $("<div>", { "class": "nexa-palette-item" }).css({
                padding: "8px",
                margin: "0 0 6px 0",
                border: "1px solid #ccc",
                "border-radius": "4px",
                background: "#fff",
                cursor: "grab",
                "font-size": "13px",
                "text-align": "center"
            }).text(def.label).appendTo(paletteEl);

            // Same jQuery-UI draggable(helper:'clone') pattern
            // @node-red/editor-client/src/js/ui/palette.js uses for
            // dragging a node type onto the flow canvas.
            chip.draggable({
                helper: "clone",
                appendTo: "#red-ui-editor",
                revert: "invalid",
                revertDuration: 100,
                zIndex: 1000,
                stop: function (e, ui) {
                    if (!artboardEl) {
                        RED.notify("Open the Pages canvas first (menu → Pages)", { type: "warning", timeout: 2000 });
                        return;
                    }
                    // artboardEl still EXISTS while the Logic tab is showing
                    // (only its pane is hidden via CSS, see buildCanvasArea)
                    // — without this check, a UI component chip dropped
                    // while looking at the Logic canvas would silently add
                    // the component anyway (invisible until you switch back
                    // to the UI tab), the same class of bug the Events
                    // chips' own drop handler already guards against in the
                    // opposite direction.
                    if (activeCanvasTab !== "ui") {
                        RED.notify("Switch to the UI tab first", { type: "warning", timeout: 2000 });
                        return;
                    }
                    // The clone helper lives outside the scaled stage
                    // (appendTo: "#red-ui-editor"), so ui.offset is a real,
                    // unscaled screen position — but artboardEl.width()/
                    // height() and addComponentAt() both work in artboard-
                    // LOCAL units, so the real-pixel delta must come down
                    // by zoomLevel before comparing/using it as local coords.
                    var offset = artboardEl.offset();
                    var x = (ui.offset.left - offset.left) / zoomLevel;
                    var y = (ui.offset.top - offset.top) / zoomLevel;
                    if (x >= 0 && y >= 0 && x <= artboardEl.width() && y <= artboardEl.height()) {
                        addComponentAt(def.id, x, y);
                    }
                }
            });
        });
    }

    // Palette for the Logic canvas — unlike buildPalette above (which lists
    // registered component TYPES), this lists per-screen node INSTANCES:
    // fixed lifecycle chips, generic utility chips, and one chip per
    // event/bindable prop actually declared by each component currently on
