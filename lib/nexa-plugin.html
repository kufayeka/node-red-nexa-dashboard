  // src/logic/logic-wires.js

        localLeft = Math.max(0, Math.min(localLeft, LOGIC_CANVAS_W - LOGIC_NODE_W));
        localTop = Math.max(0, Math.min(localTop, LOGIC_CANVAS_H - LOGIC_NODE_H));
        ui.position.left = localLeft;
        ui.position.top = localTop;
        var dx = localLeft - node.x, dy = localTop - node.y;

        state.logicSelectedIds.forEach(function(id) {

        node.x = Math.max(0, Math.min(localLeft, LOGIC_CANVAS_W - LOGIC_NODE_W));

  // src/canvas/clipboard.js
  var clipboard = null;
  var clipboardSource = null;
  var clipboardFullGroups = null;
  function copySelection(isCut) {
    if (!state.selectedIds.length) return;
    var members = state.selectedIds.map(findComponent).filter(Boolean);
    if (!members.length) return;
    var touchedGroups = {};
    members.forEach(function(c) {
      if (c.g) touchedGroups[c.g] = true;
    });
    var fullGroups = {};
    Object.keys(touchedGroups).forEach(function(gid) {
      var allMembers = groupMemberIds(gid);
      var selectedMembers = allMembers.filter(function(id) {
        return state.selectedIds.indexOf(id) !== -1;
      });
      if (allMembers.length && selectedMembers.length === allMembers.length) fullGroups[gid] = true;
    });
    clipboard = JSON.parse(JSON.stringify(members));
    clipboardFullGroups = fullGroups;
    clipboardSource = isCut ? "cut" : "copy";
    if (isCut) {
      removeComponents(state.selectedIds.slice());
    }
  }
  function pasteClipboard() {
    if (!clipboard || !clipboard.length) return;
    var screen = getActiveScreen();
    if (!screen) return;
    screen.groups = screen.groups || [];
    var regenerateIds = clipboardSource === "copy";
    var groupIdMap = {};
    var newComps = clipboard.map(function(c) {
      var copy = JSON.parse(JSON.stringify(c));
      copy.id = regenerateIds ? genId() : copy.id;
      if (regenerateIds) {
        copy.x += 20;
        copy.y += 20;
      }
      return copy;
    });
    newComps.forEach(function(copy) {
      if (!copy.g) return;
      if (!clipboardFullGroups[copy.g]) {
        delete copy.g;
      } else if (regenerateIds) {
        if (!groupIdMap[copy.g]) groupIdMap[copy.g] = genId();
        copy.g = groupIdMap[copy.g];
      }
    });
    Object.keys(groupIdMap).forEach(function(oldGid) {
      var original = (screen.groups || []).find(function(g) {
        return g.id === oldGid;
      });
      var newGroup = original ? JSON.parse(JSON.stringify(original)) : { x: 0, y: 0, w: 0, h: 0 };
      newGroup.id = groupIdMap[oldGid];
      screen.groups.push(newGroup);
    });
    newComps.forEach(function(copy) {
      screen.components.push(copy);
    });
    newComps.forEach(renderComponent);
    if (newComps.length === 1) {
      pushHistory({ t: "add", screenId: screen.id, comp: newComps[0] });
    } else {
      pushHistory({ t: "multi", screenId: screen.id, events: newComps.map(function(c) {
        return { t: "add", screenId: screen.id, comp: c };
      }) });
    }
    markDirty();
    selectMultiple(newComps.map(function(c) {
      return c.id;
    }));
    if (clipboardSource === "cut") {
      clipboard = newComps;
      clipboardFullGroups = {};
      newComps.forEach(function(c) {
        if (c.g) clipboardFullGroups[c.g] = true;
      });
      clipboardSource = "copy";
    }
  }

  // src/logic/logic-zoom.js
  function applyLogicZoomTransform() {
    if (!state.logicStageEl || !state.logicSizerEl) return;
    state.logicStageEl.css("transform", "scale(" + state.logicZoomLevel + ")");
    state.logicSizerEl.css({
      width: LOGIC_CANVAS_W * state.logicZoomLevel + "px",
      height: LOGIC_CANVAS_H * state.logicZoomLevel + "px"
    });
    if (state.logicZoomLabelEl) state.logicZoomLabelEl.text(Math.round(state.logicZoomLevel * 100) + "%");
  }
  function setLogicZoom(newZoom, focalPoint) {
    if (!state.logicViewportEl || !state.logicSizerEl) return;
    newZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
    if (newZoom === state.logicZoomLevel) return;
    var vp = state.logicViewportEl.get(0);
    if (!focalPoint) focalPoint = { x: vp.clientWidth / 2, y: vp.clientHeight / 2 };
    var sizerOffset = state.logicSizerEl.position();
    var stageX = (vp.scrollLeft + focalPoint.x - sizerOffset.left) / state.logicZoomLevel;
    var stageY = (vp.scrollTop + focalPoint.y - sizerOffset.top) / state.logicZoomLevel;
    state.logicZoomLevel = newZoom;
    applyLogicZoomTransform();
    var newOffset = state.logicSizerEl.position();
    vp.scrollLeft = stageX * state.logicZoomLevel + newOffset.left - focalPoint.x;
    vp.scrollTop = stageY * state.logicZoomLevel + newOffset.top - focalPoint.y;
  }
  function zoomLogicIn() {
    setLogicZoom(state.logicZoomLevel + ZOOM_STEP);
  }
  function zoomLogicOut() {
    setLogicZoom(state.logicZoomLevel - ZOOM_STEP);
  }
  function zoomLogicReset() {
    setLogicZoom(1);
  }
  function zoomLogicToFit() {
    if (!state.logicViewportEl) return;
    var screen = getActiveScreen();
    var nodes = screen && screen.logic && screen.logic.nodes || [];
    var vp = state.logicViewportEl.get(0);
    var pad = 60;
    if (!nodes.length) {
      zoomLogicReset();
      return;
    }
    var minX = Math.min.apply(null, nodes.map(function(n) {
      return n.x;
    }));
    var minY = Math.min.apply(null, nodes.map(function(n) {
      return n.y;
    }));
    var maxX = Math.max.apply(null, nodes.map(function(n) {
      return n.x + LOGIC_NODE_W;
    }));
    var maxY = Math.max.apply(null, nodes.map(function(n) {
      return n.y + LOGIC_NODE_H;
    }));
    var boxW = Math.max(maxX - minX, 10), boxH = Math.max(maxY - minY, 10);
    var availW = Math.max(vp.clientWidth - pad * 2, 10);
    var availH = Math.max(vp.clientHeight - pad * 2, 10);
    var fitZoom = Math.min(availW / boxW, availH / boxH);
    fitZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, fitZoom));
    state.logicZoomLevel = fitZoom;
    applyLogicZoomTransform();
    var centerX = (minX + maxX) / 2, centerY = (minY + maxY) / 2;
    vp.scrollLeft = Math.max(0, centerX * state.logicZoomLevel - vp.clientWidth / 2);
    vp.scrollTop = Math.max(0, centerY * state.logicZoomLevel - vp.clientHeight / 2);
  }

  // src/editor-tray.js
  function isEditableTarget(target) {
    var $t = window.$(target);

  }
  function onKeyDown(e) {
    if (!state.trayContent) return;
    var isTextField = isEditableTarget(e.target);
    if ((e.key === "Delete" || e.key === "Backspace") && !isTextField) {
      if (state.activeCanvasTab === "logic") {
        if (state.logicSelectedIds.length) {
          e.preventDefault();
          removeLogicNodes(state.logicSelectedIds.slice());
        }
        return;
      }
      if (state.selectedIds.length) {
        e.preventDefault();
        removeComponents(state.selectedIds.slice());
        return;
      }
    }
    if ((e.ctrlKey || e.metaKey) && !isTextField) {
      if (e.key === "z" || e.key === "Z") {
        e.preventDefault();
        if (e.shiftKey) redo();
        else undo();
      } else if (e.key === "y" || e.key === "Y") {
        e.preventDefault();
        redo();
      } else if (e.key === "g" || e.key === "G") {
        if (state.activeCanvasTab === "ui") {
          e.preventDefault();
          if (e.shiftKey) ungroupSelection();
          else groupSelection();
        }
      } else if (e.key === "c" || e.key === "C") {
        e.preventDefault();
        if (state.activeCanvasTab === "logic") copyLogicSelection(false);
        else copySelection(false);
      } else if (e.key === "x" || e.key === "X") {
        e.preventDefault();
        if (state.activeCanvasTab === "logic") copyLogicSelection(true);
        else copySelection(true);
      } else if (e.key === "v" || e.key === "V") {
        e.preventDefault();
        if (state.activeCanvasTab === "logic") pasteLogicClipboard();
        else pasteClipboard();
      }
    }
    if (state.activeCanvasTab === "ui" && !isTextField && !e.ctrlKey && !e.metaKey && e.shiftKey) {
      if (e.key === "H" || e.key === "h") {
        e.preventDefault();
        toggleFlipForSelection("h");
        return;
      }
      if (e.key === "V" || e.key === "v") {

        toggleFlipForSelection("v");
        return;
      }
    }
  }

    var screensSplit = window.$("<div>").css({ display: "flex", "flex-direction": "row", height: "100%", width: "100%", "min-height": "400px", "box-sizing": "border-box" }).appendTo(screensPane);
    var screenLeftCol = window.$("<div>").css({
      flex: "0 0 240px",
      width: "240px",
      "min-width": "200px",
      "max-width": "300px",
      display: "flex",
      "flex-direction": "column",
      height: "100%",
      "border-right": "1px solid var(--red-ui-secondary-border-color, #e0e0e0)",
      background: "var(--red-ui-secondary-background, #fafafa)",
      "box-sizing": "border-box"
    }).appendTo(screensSplit);
    var screenToolbar = window.$("<div>").css({
      display: "flex",
      "align-items": "center",
      "justify-content": "space-between",
      padding: "8px 10px",
      "border-bottom": "1px solid var(--red-ui-secondary-border-color, #f0f0f0)",
      background: "var(--red-ui-tertiary-background, #f8fafc)",
      "flex-shrink": "0"
    }).appendTo(screenLeftCol);
    window.$("<span style='font-size: 11px; font-weight: bold; text-transform: uppercase; color: var(--red-ui-secondary-text-color, #64748b); display: flex; align-items: center; gap: 5px;'><i class='fa fa-desktop'></i> Screens</span>").appendTo(screenToolbar);
    window.$("<button>", { type: "button", "class": "red-ui-button red-ui-button-primary red-ui-button-small" }).text("+ Add Screen").css({ "font-size": "11px", padding: "2px 8px", height: "24px", "line-height": "20px" }).on("click", addScreenFromSidebar).appendTo(screenToolbar);
    var screenListWrap = window.$("<div>").css({ flex: "1 1 auto", "min-height": "0", "overflow-y": "auto", padding: "6px" }).appendTo(screenLeftCol);
    state.screenListEl = window.$("<div>", { "class": "nexa-screen-list" }).appendTo(screenListWrap);
    var screenRightCol = window.$("<div>").css({
      flex: "1 1 auto",
      display: "flex",
      "flex-direction": "column",
      height: "100%",
      "overflow-y": "auto",
      padding: "12px 16px",
      "box-sizing": "border-box",
      background: "var(--red-ui-primary-background, #fff)"
    }).appendTo(screensSplit);
    state.screenFormEl = window.$("<div>", { "class": "nexa-screen-form" }).appendTo(screenRightCol);
    var templatesSplit = window.$("<div>").css({ display: "flex", "flex-direction": "row", height: "100%", width: "100%", "min-height": "400px", "box-sizing": "border-box" }).appendTo(state.templatesPane);
    var templateLeftCol = window.$("<div>").css({
      flex: "0 0 240px",
      width: "240px",
      "min-width": "200px",
      "max-width": "300px",
      display: "flex",
      "flex-direction": "column",
      height: "100%",
      "border-right": "1px solid var(--red-ui-secondary-border-color, #e0e0e0)",
      background: "var(--red-ui-secondary-background, #fafafa)",
      "box-sizing": "border-box"
    }).appendTo(templatesSplit);
    var templateToolbar = window.$("<div>").css({
      display: "flex",
      "align-items": "center",
      "justify-content": "space-between",
      padding: "8px 10px",
      "border-bottom": "1px solid var(--red-ui-secondary-border-color, #f0f0f0)",
      background: "var(--red-ui-tertiary-background, #f8fafc)",
      "flex-shrink": "0"
    }).appendTo(templateLeftCol);
    window.$("<span style='font-size: 11px; font-weight: bold; text-transform: uppercase; color: var(--red-ui-secondary-text-color, #64748b); display: flex; align-items: center; gap: 5px;'><i class='fa fa-clone'></i> Templates</span>").appendTo(templateToolbar);
    window.$("<button>", { type: "button", "class": "red-ui-button red-ui-button-primary red-ui-button-small" }).text("+ Add Template").css({ "font-size": "11px", padding: "2px 8px", height: "24px", "line-height": "20px" }).on("click", addTemplateFromSidebar).appendTo(templateToolbar);
    var templateListWrap = window.$("<div>").css({ flex: "1 1 auto", "min-height": "0", "overflow-y": "auto", padding: "6px" }).appendTo(templateLeftCol);
    state.templateListEl = window.$("<div>", { "class": "nexa-template-list" }).appendTo(templateListWrap);
    var templateRightCol = window.$("<div>").css({
      flex: "1 1 auto",
      display: "flex",
      "flex-direction": "column",
      height: "100%",
      "overflow-y": "auto",
      padding: "12px 16px",
      "box-sizing": "border-box",
      background: "var(--red-ui-primary-background, #fff)"
    }).appendTo(templatesSplit);
    state.templateFormEl = window.$("<div>", { "class": "nexa-template-form" }).appendTo(templateRightCol);
    state.sidebarTabs = window.RED.tabs.create({
      element: ul,
      onchange: function(tab) {
        if (!tab) return;
        state.componentsPane.css("display", tab.id === "components" ? "flex" : "none");
        screensPane.toggle(tab.id === "screens");
        state.propertiesPane.toggle(tab.id === "properties");
        state.layersPane.toggle(tab.id === "layers");
        state.eventsPane.css("display", tab.id === "events" ? "flex" : "none");
        state.templatesPane.toggle(tab.id === "templates");
        state.sparkplugPane.css("display", tab.id === "sparkplug" ? "flex" : "none");
        if (tab.id === "screens") {
          if (state.editingMode === "template") exitTemplateEditing();
          ensureScreensLoaded(function() {
            renderScreenList();
            renderScreenForm();
          });
        }
        if (tab.id === "templates") {
          ensureScreensLoaded(function() {
            renderTemplateList();
            renderTemplateForm();
          });
        }
        if (tab.id === "components") buildPalette(state.componentsPane);
        if (tab.id === "properties") renderPropertiesPanel();
        if (tab.id === "layers") renderLayersPanel();
        if (tab.id === "events") renderEventsPanel();
        if (tab.id === "sparkplug") renderSparkplugPanel();
      }
    });
    state.sidebarTabs.addTab({ id: "components", label: "Components" });
    state.sidebarTabs.addTab({ id: "screens", label: "Screens" });
    state.sidebarTabs.addTab({ id: "templates", label: "Templates" });
    state.sidebarTabs.addTab({ id: "properties", label: "Properties" });
    state.sidebarTabs.addTab({ id: "layers", label: "Layers" });
    state.sidebarTabs.addTab({ id: "events", label: "Events" });
    state.sidebarTabs.addTab({ id: "sparkplug", label: "MQTT Sparkplug" });
    if (window.NEXA && typeof window.NEXA.onRegister === "function") {
      window.NEXA.onRegister(function() {
        if (state.componentsPane) {
          buildPalette(state.componentsPane);
        }
        if (state.eventsPane && state.eventsPane.is(":visible")) {
          renderEventsPanel();
        }
      });
    }
    return container;
  }

  // src/index.js
  registerHistoryRenderers(renderActiveScreen, renderLogicCanvas);
  registerPagesEditorAction();
  if (typeof window.RED !== "undefined" && window.RED.plugins) {
    window.RED.plugins.registerPlugin("kufayeka-nexa-dashboard", {
      type: "node-red-editor-plugin",
      onadd: function() {
        window.RED.sidebar.addTab({
          id: "nexa-dashboard-sidebar",
          label: "Nexa",
          name: "Nexa Dashboard",
          iconClass: "fa fa-object-group",
          content: buildSidebarContent(),
          enableOnEdit: true
        });
      }
    });
  }
})();

</script>
